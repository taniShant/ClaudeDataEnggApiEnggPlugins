InternalTiaaUsRopcAuth:
  type: oauth2
  description: OAuth2.0 Resource Owner Password Credentials (ROPC) Grant authentication using TIAA-US for internal APIs
  flows:
    password:
      tokenUrl: 'https://api.barclays.com/oauth2/token'
      scopes:
        read: 'read only'
        write: 'write only'
