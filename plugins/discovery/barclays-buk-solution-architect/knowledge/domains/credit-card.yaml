  sub_domains:
    - id: sub.cc.billing-and-statement-management
      name: Billing and Statement Management
      description: The Billing and Statement Management capability group encompasses the generation and delivery of account statements, calculation of interest and fees, management of repayments, and administration of billing cycles.
      capabilities:
        - id: cap.cc.calculate-interest-fees-and-charges
          name: Calculate Interest, Fees and Charges
          description: Calculation and application of interest charges across balance types including daily accruals, billing cycle processing, fee identification and computation, charge posting, notification generation, and waiver processing to ensure accurate account balances and compliant fee administration.
        - id: cap.cc.generate-credit-card-account-statements
          name: Generate Credit Card Account Statements
          description: Generation and distribution of account statements through transaction data compilation, total and minimum payment calculation, regulatory formatting, preferred channel delivery, delivery tracking, preference management, variation notices, and regulatory disclosures to ensure compliant customer communications.
        - id: cap.cc.manage-billing-cycles
          name: Manage Billing Cycles
          description: Management of billing cycle establishment, account grouping, cycle-based processing, customer-requested date changes, operational adjustments, transition period handling, end-of-cycle processing, and cycle reporting to ensure timely statement generation and operational efficiency.
        - id: cap.cc.manage-repayments
          name: Manage Repayments
          description: Management of account repayments including minimum payment determination, payment schedule creation, amortization calculations, payoff timeline projections, payment allocation across balance types, hierarchy rule application, and reversal processing to maintain accurate balances and support customer financial planning.
    - id: sub.cc.credit-and-balance-management
      name: Credit and Balance Management
      description: The Credit and Balance Management capability group covers the management of credit limits, balances, instalment plans, and persistent debt situations, ensuring appropriate credit administration and customer repayment options.
      capabilities:
        - id: cap.cc.administer-credit-limits
          name: Administer Credit Limits
          description: Administration of credit limit establishment, allocation configuration, increase eligibility evaluation, customer-requested changes, proactive programs, risk-based decreases, and comprehensive customer communications to manage credit exposure while enhancing customer relationships and ensuring transparency.
        - id: cap.cc.manage-instalment-plans
          name: Manage Instalment Plans
          description: Management of instalment payment plans for large purchases or balance conversions including plan creation with appropriate terms, balance tracking, payment processing, early payoff handling, and modification management.
        - id: cap.cc.manage-persistent-debt
          name: Manage Persistent Debt
          description: Identification and management of persistent debt situations through regulatory criteria application, intervention planning, customised communication strategies, and sustainable repayment schedule creation to support customer financial health and regulatory compliance.
        - id: cap.cc.manage-promotional-balances
          name: Manage Promotional Balances
          description: Management of promotional balance offers including introductory rates, balance transfers, and special financing through offer setup, balance segregation and tracking, payment allocation monitoring, and promotion expiration handling with customer notifications.
    - id: sub.cc.credit-card-account-maintenance-and-servicing
      name: Credit Card Account Maintenance and Servicing
      description: The Account Maintenance and Servicing capability group covers the ongoing maintenance and servicing of credit card accounts, including information access, activity tracking, preference management, relationship management, and account closure.
      capabilities:
        - id: cap.cc.close-accounts
          name: Close Accounts
          description: Processing of customer-requested and bank-initiated account closures including eligibility validation, outstanding balance settlement, recurring charge cancellation, status updates, confirmation documentation, post-closure payment handling, and reinstatement request management to ensure compliant and complete closure processes.
        - id: cap.cc.manage-account-memos
          name: Manage Account Memos
          description: Management of structured and free-text account notes with categorization, priority assignment, and event association, enabling memo search, retrieval, updating, retention policy enforcement, and access control to support customer servicing and information security requirements.
        - id: cap.cc.manage-account-preferences
          name: Manage Account Preferences
          description: Management of customer preferences for account features, rewards enrollment, service options, contact methods, communication timing, marketing preferences, and statement delivery, including preference updates, history tracking, and cross-channel synchronization to maintain consistent customer experience.
        - id: cap.cc.manage-account-relationships
          name: Manage Account Relationships
          description: Management of account relationship structures including primary and secondary cardholders, authorized users, access permissions, ownership changes, name and legal status updates, account linkages, and cross-product portfolio views to maintain accurate customer records and support holistic relationship management.
        - id: cap.cc.provide-account-information
          name: Provide Account Information
          description: Provision of comprehensive credit card account information including balances, available credit, transaction history, statements, account terms, and payment details, enabling informed customer decision-making and account management.
        - id: cap.cc.record-account-activity
          name: Record Account Activity
          description: Recording of all account maintenance activities, user actions, system events, and status changes, creating comprehensive activity logs, audit trails, and reports to support operational analysis, compliance, and investigation requirements.
    - id: sub.cc.credit-card-account-opening-and-configuration
      name: Credit Card Account Opening and Configuration
      description: The Account Opening and Configuration capability group covers the end-to-end process of establishing new credit card accounts, from application processing and account creation to activation and agreement management.
      capabilities:
        - id: cap.cc.activate-credit-card-accounts
          name: Activate Credit Card Accounts
          description: Activation of credit card accounts through customer verification, status management, activation confirmation, and audit trail creation, ensuring secure identity validation and proper account enablement for immediate card usage.
        - id: cap.cc.credit-card-process-applications
          name: Credit Card Process Applications
          description: Processing of credit card applications including information collection, validation, document verification, partner integration, source tracking, welcome communications, regulatory disclosures, and onboarding to ensure compliant and efficient customer acquisition.
        - id: cap.cc.manage-credit-card-agreements-and-terms
          name: Manage Credit Card Agreements and Terms
          description: Management of credit card agreement lifecycle including terms presentation, customer acceptance recording, amendment processing, version history tracking, special terms administration, exception documentation, and approval workflows to ensure regulatory compliance and accurate agreement records.
        - id: cap.cc.open-credit-card-accounts
          name: Open Credit Card Accounts
          description: Establishment of new credit card accounts through application data capture and validation, customer profile creation, account record generation with appropriate product linkages, and initial configuration of credit limits, settings, and restrictions to enable customer usage.
    - id: sub.cc.credit-card-product-management
      name: Credit Card Product Management
      description: The Product Management capability group encompasses the design, development, configuration, and lifecycle management of credit card products, including pricing strategies, risk models, and product information services.
      capabilities:
        - id: cap.cc.credit-card-manage-product-lifecycle
          name: Credit Card Manage Product Lifecycle
          description: Management of product lifecycle including account transfers between products, product evolution, migration between platforms, and retirement of discontinued products while maintaining account history and customer relationships.
        - id: cap.cc.design-credit-card-products
          name: Design Credit Card Products
          description: Development and configuration of draft credit card products from initial ideation through to pre-publication readiness, excluding launch activities.
        - id: cap.cc.manage-pricing-and-risk-models
          name: Manage Pricing and Risk Models
          description: Development of pricing models considering development costs, marketing, fraud, risk exposure, and operational expenses, supporting product approval processes and competitive positioning.
        - id: cap.cc.provide-credit-card-product-information
          name: Provide Credit Card Product Information
          description: Provision of credit card product information including terms and conditions, pricing, features, and benefits to marketing channels, enabling customers to make informed decisions about product suitability for their needs.
    - id: sub.cc.credit-card-transaction-processing-and-management
      name: Credit Card Transaction Processing and Management
      description: The Transaction Processing and Management capability group encompasses the authorisation, posting, processing, and adjustment of credit card transactions, ensuring accurate and timely transaction management.
      capabilities:
        - id: cap.cc.authorise-credit-card-transactions
          name: Authorise Credit Card Transactions
          description: Real-time evaluation and authorisation of credit card transactions based on account status, available credit, fraud detection rules, and customer-defined controls, generating appropriate approval or decline decisions.
        - id: cap.cc.manage-reversals-and-adjustments
          name: Manage Reversals and Adjustments
          description: Processing of transaction reversals, chargebacks, and financial adjustments including merchant-initiated reversals, manual corrections, fee waivers, and dispute resolution to ensure accurate balance management and proper documentation.
        - id: cap.cc.post-credit-card-transactions
          name: Post Credit Card Transactions
          description: Posting of finalised transactions to customer accounts through clearing processes, balance updates across categories, and comprehensive transaction history maintenance with complete and accurate details.
        - id: cap.cc.process-credit-card-payments
          name: Process Credit Card Payments
          description: Processing of credit card payments including interchange fee calculation, settlement file processing, payment reconciliation, and exception handling to ensure accurate account crediting and network settlement.
