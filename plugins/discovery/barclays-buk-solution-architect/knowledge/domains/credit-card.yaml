schema_version: '1.0'
domain:
  id: dom.credit-card
  name: Credit Card
  description: The Credit Card domain encompasses the core capabilities required to issue, process, and manage credit card and charge card accounts throughout their lifecycle.  This includes product configuration, account origination and setup, transaction posting, credit limit management, billing and statements, account servicing, and customer engagement.  The domain provides the essential functionality to maintain credit card accounts and associated transaction information while integrating with other enterprise domains for payment card issuing, risk assessment, network processing, compliance, and reward programs.
