schema_version: '1.0'
domain:
  id: dom.customer-servicing
  name: Customer Servicing
  description: The Customer Servicing domain encompasses a suite of service domains that support all customer-facing interactions, enabling Barclays to engage with customers consistently across both colleague-assisted and digital channels. It ensures the delivery of accurate information, timely support, personalised service, and seamless fulfilment throughout the customer lifecycle. The primary aim of the domain is to ensure interactions are informed, well-governed, and tailored to individual customer needs by leveraging real-time customer data. Contextual indicators - such as high-value customer status or potential fraud alerts - directly inform routing, servicing, and fulfilment decisions during an interaction. The domain supports a wide range of servicing activities, including changes of name and address, appointment scheduling, customer marker management, and comprehensive audit and compliance processes, among others.
