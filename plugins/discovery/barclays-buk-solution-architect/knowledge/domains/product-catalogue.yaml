schema_version: '1.0'
domain:
  id: dom.product-catalogue
  name: Product Catalogue
  description: "Product Catalogue provides a centralized domain to aggregate, maintain, and expose a consistent representation of personalized and non-personalized products, offerings and benefits & rewards across the bank without performing eligibility evaluation, decisioning, or product fulfilment. It acts as a non-authoritative representation layer, consolidating product information from multiple product domains to enable unified discovery and presentation across all channels, while preserving ownership of product data, lifecycle, and eligibility within their respective domains. It adds business value by addressing fragmented product information across systems today and provides a central, standardized view of products across all channels, in future. It addresses the current fragmentation of product information across systems by providing a central, standardised view of products, positioning the bank towards a unified and reusable product representation model. This enables consistent customer journeys, simplified channel integration and scalable product discovery & presentation."
