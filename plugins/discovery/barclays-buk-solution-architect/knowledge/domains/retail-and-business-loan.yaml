schema_version: '1.0'
domain:
  id: dom.retail-and-business-loan
  name: Retail and Business Loan
  description: The Retail and Business Loan domain encompasses the end-to-end management of monetary loans throughout their lifecycle. This includes product configuration and management, account origination and setup, fund disbursement, transaction processing, repayment scheduling, balance and statement management, account servicing, and customer engagement. The sub-domains provide comprehensive capabilities to design, offer, originate, disburse, manage, and service fixed-term loans for retail and business banking customers, ensuring regulatory compliance while delivering value to both customers and the bank.
  owner: capl
  bian_links:
