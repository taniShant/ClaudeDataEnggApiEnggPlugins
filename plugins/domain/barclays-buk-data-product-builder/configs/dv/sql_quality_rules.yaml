# =============================================================================
# DV Plugin — SQL Quality Rules
# 11 checks (QUALITY-01–QUALITY-11) to ensure generated validation SQL
# faithfully implements the validation plan.
# =============================================================================

version: "1.0"
description: >
  SQL quality validation rules for the Data Validation stage of the Barclays BUK
  Data Product Builder plugin. These rules are applied to every SQL file
  generated by the DV renderer, cross-referenced against the validation plan and
  contract JSONs. They verify plan-to-SQL coverage, dialect correctness, filter
  presence, and structural fidelity. Blockers trigger self-heal retries but do
  not halt the pipeline — artifacts are written with a warning after 2 retries.

sql_quality:

  # ---------------------------------------------------------------------------
  # Coverage rules — plan-to-SQL fidelity
  # ---------------------------------------------------------------------------

  - id: QUALITY-01
    category: coverage
    check: "Every plan check_id has a comment header in _validation.sql"
    severity: blocker
    engine_scope: both
    sql_variant: raw
    logic: |
      1. Extract all check_id values from plan JSON checks[] array
      2. Scan _validation.sql for lines matching: /^--\s+(ER|SCD2|NC|DC|DT|BR)-\d{2}\s*:/
      3. Compute: missing = plan_check_ids - sql_check_ids
      4. If missing is non-empty → violation per missing check_id
    error_message: "Plan check {{check_id}} not found in rendered SQL — expected comment header '-- {{check_id}}:'"
    fix_suggestion: "Re-render SQL ensuring every plan check_id appears as a comment header section."

  - id: QUALITY-02
    category: coverage
    check: "Every plan check_id appears in _results_summary.sql"
    severity: blocker
    engine_scope: both
    sql_variant: raw
    logic: |
      1. Extract all check_id values from plan JSON checks[] array
      2. Scan _results_summary.sql for occurrences of each check_id (as CTE name or string literal)
      3. Case-insensitive matching
      4. Compute: missing = plan_check_ids - summary_check_ids
      5. If missing is non-empty → violation per missing check_id
    error_message: "Plan check {{check_id}} not found in results summary SQL."
    fix_suggestion: "Re-render results_summary.sql ensuring every plan check_id is represented as a CTE or string literal."

  - id: QUALITY-03
    category: coverage
    check: "Metadata header category counts match plan counts"
    severity: warning
    engine_scope: both
    sql_variant: raw
    logic: |
      1. Count checks per category in plan JSON (group by check_id prefix: ER, SCD2, NC, DC, DT, BR)
      2. Parse metadata header from _validation.sql: /^-- Validation Summary:\s*(.+)$/m
      3. Extract category=count pairs from the header
      4. Compare plan counts vs header counts
      5. If any mismatch → violation per mismatched category
    error_message: "Metadata header says {{category}}={{header_count}} but plan has {{plan_count}} {{category}} checks."
    fix_suggestion: "Update the metadata header to reflect correct plan counts."

  # ---------------------------------------------------------------------------
  # Dialect rules — engine-specific correctness
  # ---------------------------------------------------------------------------

  - id: QUALITY-05
    category: dialect
    check: "Correct table naming convention (2-part vs 3-part) for engine"
    severity: blocker
    engine_scope: engine_specific
    sql_variant: raw
    logic: |
      For engine = "athena":
        1. Scan FROM/JOIN clauses for 3-part dot-qualified references: /\b\w+\.\w+\.\w+\b/
        2. Exclude parameterized placeholders ({{...}}.{{...}}.{{...}})
        3. If 3-part references found → violation
      For engine = "databricks":
        1. Scan FROM/JOIN clauses for table references
        2. Identify 2-part references where contract specifies catalog
        3. If 2-part references found → violation
    error_message: "{{engine}} requires {{expected_parts}}-part naming but found {{found_parts}}-part reference: '{{reference}}'."
    fix_suggestion: "Use {{expected_parts}}-part naming ({{example}}) for all table references."

  - id: QUALITY-06
    category: dialect
    check: "Correct date function for engine (date_diff vs DATEDIFF)"
    severity: blocker
    engine_scope: engine_specific
    sql_variant: comment_stripped
    logic: |
      For engine = "athena":
        regex: /\bDATEDIFF\s*\(/i → violation (Athena uses date_diff('day', d1, d2))
      For engine = "databricks":
        regex: /\bdate_diff\s*\(\s*'/i → violation (Databricks uses DATEDIFF(d1, d2))
    error_message: "Wrong date function for {{engine}}: found '{{found_function}}', expected '{{expected_function}}'."
    fix_suggestion: "Replace {{found_function}} with {{expected_function}}."

  - id: QUALITY-07
    category: dialect
    check: "No EXCEPT ALL in Athena SQL (Presto does not support it)"
    severity: blocker
    engine_scope: athena
    sql_variant: comment_stripped
    logic: |
      1. Skip if engine != "athena"
      2. regex: /\bEXCEPT\s+ALL\b/i → violation
    error_message: "EXCEPT ALL is not supported in Athena/Presto — use GROUP BY frequency comparison (ER-08 pattern)."
    fix_suggestion: "Replace EXCEPT ALL with the multiset frequency comparison workaround from dv-athena-sql-patterns.md (ER-08 template)."

  # ---------------------------------------------------------------------------
  # Filter & parameterization rules
  # ---------------------------------------------------------------------------

  - id: QUALITY-08
    category: filter
    check: "ER check source/target filters from plan present in SQL"
    severity: blocker
    engine_scope: both
    sql_variant: raw
    logic: |
      For each plan check where check_id matches /^ER-\d{2}$/:
        1. Read parameters.source_filter from plan (if present and not "1 = 1")
        2. Locate the SQL section for this check_id in _validation.sql
        3. Search the section for the source_filter text (case-insensitive, whitespace-normalized)
        4. If not found → violation
        5. Repeat for parameters.target_filter (if present and not "1 = 1")
    error_message: "ER check {{check_id}} is missing the planned source_filter: '{{source_filter}}'."
    fix_suggestion: "Add the source_filter from the plan's parameters to the WHERE clause of the source subquery."

  - id: QUALITY-09
    category: filter
    check: "SCD2 ER checks include control_date filter"
    severity: blocker
    engine_scope: both
    sql_variant: raw
    precondition: "table_type == 'NonTransactional_SCD2'"
    logic: |
      1. Skip if table_type is not "NonTransactional_SCD2"
      2. For each plan check where check_id matches /^ER-\d{2}$/:
        a. Locate the SQL section for this check_id in _validation.sql
        b. Search the section for: /DATE\s+'{{control_date}}'/i
        c. If not found → violation
    error_message: "SCD2 table ER check {{check_id}} is missing DATE '{{control_date}}' filter — reconciliation will include all historical versions."
    fix_suggestion: "Add SCD2 as-of-date filter: eff_start_col <= DATE '{{control_date}}' AND eff_end_col > DATE '{{control_date}}'."

  # ---------------------------------------------------------------------------
  # Structure rules
  # ---------------------------------------------------------------------------

  - id: QUALITY-10
    category: structure
    check: "Section separator comments present per check category"
    severity: warning
    engine_scope: both
    sql_variant: raw
    logic: |
      1. Count distinct check categories present in plan (ER, SCD2, NC, DC, DT, BR)
      2. Count section separator lines in _validation.sql matching: /^-- ═{10,}/m
      3. If separator_count < category_count → violation
    error_message: "Found {{separator_count}} section separators but plan has {{category_count}} check categories."
    fix_suggestion: "Add '-- ══════...' comment separators between check category sections."

  # ---------------------------------------------------------------------------
  # UNION ALL rendering rules
  # ---------------------------------------------------------------------------

  - id: QUALITY-11
    category: dialect
    check: "No ORDER BY inside intermediate UNION ALL branches"
    severity: blocker
    engine_scope: both
    sql_variant: comment_stripped
    logic: |
      1. Split the SQL text on the token UNION ALL (case-insensitive)
      2. For every branch except the last one, check whether the branch text contains
         an ORDER BY clause: /\bORDER\s+BY\b/i
      3. If any intermediate branch contains ORDER BY → violation
    error_message: "ORDER BY found inside an intermediate UNION ALL branch — syntax error in both Athena/Presto and Databricks/Spark SQL. Move ORDER BY to after the final UNION ALL branch."
    fix_suggestion: "Remove ORDER BY from all intermediate UNION ALL branches. Keep a single ORDER BY after the last branch to sort the combined result set."
