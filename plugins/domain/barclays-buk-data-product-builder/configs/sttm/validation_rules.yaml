  - id: M23
    category: mapping_content
    check: "Source Table Name must use {database}.{table} format; Source Column Name must use {database}.{table}.{column} format for all non-special entries"
    severity: blocker
    applies_to: all
    logic: |
      special_values = ['(system)', '(derived)', 'Hardcoded', 'N/A', '']
      # Build per-reference file source index from comma-separated source_database.
      # Hybrid rows have mixed entries like "(file:parquet), e_loans_db" — each
      # source_database entry corresponds positionally to its source_table/source_column.
      raw_dbs = [trim(db) for db in split_comma(source_database)]
      file_db_set = {db.lower() for db in raw_dbs if db.lower() == '(file:parquet)'}
      has_file_source = len(file_db_set) > 0
      # Check Source Table Name (H) — table sources must contain a dot (database.table);
      # file sources use absolute storage paths (skip dot check).
      if source_table_name not in special_values:
        raw_tables = [trim(t) for t in split_comma(source_table_name)]
        if len(raw_tables) != len(raw_dbs):
          return FAIL("source_table_name", source_table_name, "positional mismatch — {0} tables but {1} databases; each table must have a corresponding database".format(len(raw_tables), len(raw_dbs)))
        for idx, table_ref in enumerate(raw_tables):
          if table_ref in special_values:
            continue
          ref_db = raw_dbs[idx]
          if ref_db.lower() == '(file:parquet)':
            continue  # file sources use storage paths, not {database}.{table}
          if '.' not in table_ref:
            return FAIL("source_table_name", table_ref, "missing database prefix — must be {database}.{table}")
      # Check Source Column Name (I) — per-reference validation:
      # File source columns accept 2-part FQN ({logical_name}.{column}).
      # Table source columns require 3-part FQN ({database}.{table}.{column}).
      # In hybrid rows (mixed file + table), each column ref is validated against
      # its corresponding source_database entry.
      if source_column_name not in special_values:
        raw_cols = [trim(c) for c in split_comma(source_column_name)]
        for idx, col_ref in enumerate(raw_cols):
          if col_ref in special_values:
            continue
          dot_count = count(col_ref, '.')
          ref_db = raw_dbs[idx]
          if ref_db.lower() == '(file:parquet)':
            if dot_count < 1:
              return FAIL("source_column_name", col_ref, "must be at least {logical_name}.{column} (2-part qualified) for file sources")
          else:
            if dot_count != 2:
              return FAIL("source_column_name", col_ref, "must be {database}.{table}.{column} (3-part qualified)")
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has unqualified source reference '{{value}}'. Source Table Name must be {database}.{table}; Source Column Name must be {database}.{table}.{column} (or {logical_name}.{column} for file sources)."
    fix_suggestion: "Use fully qualified naming: Source Table = 'database.table', Source Column = 'database.table.column'. Example: 'e_loans_tallyman_db.TETLTABA.ACCOUNT_BALANCE_AMOUNT'. For file sources (source_database='(file:parquet)'), 2-part FQN is accepted: '{logical_name}.{column}'."
    notes: >
      This rule enforces unambiguous lineage traceability across databases.
      Without the database prefix, tables from different databases sharing the
      same name become indistinguishable. The 3-part format eliminates all ambiguity.
      This rule applies to ALL source column references, including infrastructure
      columns used in joins/filters but not directly mapped to target columns.
      The 3-part format ({database}.{table}.{column}) eliminates all ambiguity
      for column-level lineage tracing. Source Column Name references MUST
      include the database prefix even for single-source tables.
      Exception: file sources (source_database='(file:parquet)') use a 2-part FQN
      ({logical_name}.{column}) because there is no database catalog. The
      source_database marker '(file:parquet)' serves as the namespace qualifier.
      Hybrid rows: When source_database is comma-separated and contains both
      '(file:parquet)' and real database names (e.g., "(file:parquet), e_loans_db"),
      each source column reference is validated against its positionally corresponding
      source_database entry — file columns accept 2-part, table columns require 3-part.
      Source Table Name validation also uses positional mapping: file source entries
      (storage paths) are skipped, while table source entries require {database}.{table}.

  - id: M24
    category: mapping_content
    check: "Business Logic using structured format must not have expression duplicated before 'Driver Table:' line"
    severity: warning
    applies_to: all
    logic: |
      logic_text = business_logic
      if 'Driver Table:' in logic_text:
        lines = split_newlines(logic_text)
        first_line = trim(lines[0])
        if not starts_with(first_line, 'Driver Table:'):
          # Content exists before the structured block — likely duplicated expression
          return FAIL(first_line)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has content before 'Driver Table:' line in Business Logic: '{{value}}'. When using multi-table structured format, the expression must appear ONLY in the Value: line."
    fix_suggestion: "Remove the leading expression line. The transformation expression should appear only in the 'Value:' line of the structured block. Business Logic should start with 'Driver Table:' when multi-table format is used."
    notes: >
      Catches the common generation bug where the row-generator emits the derivation
      expression as a leading line AND again inside the Value: field of the structured
      block, causing the Excel cell to show the logic twice.

  # --- Multi-Step Lineage Completeness Rules (M25, M27-M33) ---
  # These rules apply only when intermediate_steps is non-empty (multi-statement ETL).
