# =============================================================================
# STTM Plugin — Validation Rules (Section 6)
# 102 checks across 7 categories (S1-S7, M1-M54, SC1-SC20, A1-A7, F1-F13, FIO1-FIO4, MF1-MF6)
# =============================================================================

version: "1.2"
description: >
  Complete set of validation rules for the STTM Generator Plugin.
  Phase C additions: M42-M50 (UNION, source-logic consistency, window/aggregate
  metadata, multi-step lineage, crypto DE naming, alias coverage), SC20 (SCD2
  active column guard), A7 (audit column completeness per table type).
  Each rule fires during the Validator pipeline stage. Blockers prevent
  output generation; warnings are surfaced but do not halt the pipeline.

# -----------------------------------------------------------------------------
# Category 1: Schema Validations (S1–S7)
# -----------------------------------------------------------------------------
schema:
  - id: S1
    category: schema
    check: "Target column name is valid snake_case (lowercase letters, underscores, no leading digits)"
    severity: blocker
    applies_to: all
    logic: |
      regex_match(column_name, r'^[a-z][a-z0-9_]*$')
    error_message: "Column '{{column}}' in row {{row}} is not valid snake_case: '{{value}}'"
    fix_suggestion: "Rename the target column to lowercase with underscores only, starting with a letter (e.g., 'customer_id')."

  - id: S2
    category: schema
    check: "Target datatype is a valid Iceberg/Spark type (string, int, bigint, decimal(p,s), date, timestamp, boolean, float, double)"
    severity: blocker
    applies_to: all
    logic: |
      value_lower = lower(trim(datatype))
      valid_types = ['string', 'int', 'bigint', 'date', 'timestamp', 'boolean', 'float', 'double']
      if value_lower in valid_types:
        return PASS
      if regex_match(value_lower, r'^decimal\(\d+,\s*\d+\)$'):
        return PASS
      return FAIL
    error_message: "Column '{{column}}' in row {{row}} has invalid datatype: '{{value}}'"
    fix_suggestion: "Use one of: string, int, bigint, decimal(p,s), date, timestamp, boolean, float, double."

  - id: S3
    category: schema
    check: "Null flag is exactly Y or N"
    severity: blocker
    applies_to: all
    logic: |
      trim(null_flag) in ['Y', 'N']
    error_message: "Column '{{column}}' in row {{row}} has invalid Null Flag: '{{value}}'. Must be Y or N."
    fix_suggestion: "Set the Null Flag to exactly 'Y' (nullable) or 'N' (not nullable)."

  - id: S4
    category: schema
    check: "Key Column is Y, N, or blank"
    severity: warning
    applies_to: all
    logic: |
      trim(key_column) in ['Y', 'N', '']
    error_message: "Column '{{column}}' in row {{row}} has invalid Key Column value: '{{value}}'. Expected Y, N, or blank."
    fix_suggestion: "Set Key Column to 'Y' if the column is part of the primary/business key, 'N' if not, or leave blank."

  - id: S5
    category: schema
    check: "Transformation Type is one of: Direct, Derived, Lookup, Direct - Type Cast, or blank"
    severity: warning
    applies_to: all
    logic: |
      trim(transformation_type) in ['Direct', 'Derived', 'Lookup', 'Direct - Type Cast', '']
    error_message: "Column '{{column}}' in row {{row}} has invalid Transformation Type: '{{value}}'."
    fix_suggestion: "Use one of: 'Direct', 'Derived', 'Lookup', 'Direct - Type Cast', or leave blank."

  - id: S6
    category: schema
    check: "Target Table Type is one of: NonTransactional_SCD2, NonTransactional_SCD1, Transactional, or blank"
    severity: warning
    applies_to: all
    logic: |
      trim(target_table_type) in ['NonTransactional_SCD2', 'NonTransactional_SCD1', 'Transactional', '']
    error_message: "Row {{row}} has invalid Target Table Type: '{{value}}'."
    fix_suggestion: "Set Target Table Type to 'NonTransactional_SCD2', 'NonTransactional_SCD1', 'Transactional', or leave blank."

  - id: S7
    category: schema
    check: "Default Value (if present) is compatible with target datatype"
    severity: warning
    applies_to: all
    logic: |
      if default_value is empty:
        return PASS
      if datatype == 'int' and not is_integer(default_value):
        return FAIL
      if datatype == 'bigint' and not is_integer(default_value):
        return FAIL
      if datatype in ['float', 'double'] and not is_numeric(default_value):
        return FAIL
      if datatype startswith 'decimal' and not is_numeric(default_value):
        return FAIL
      if datatype == 'boolean' and lower(default_value) not in ['true', 'false']:
        return FAIL
      if datatype == 'date' and not is_valid_date(default_value):
        return FAIL
      if datatype == 'timestamp' and not is_valid_timestamp(default_value):
        return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has default value '{{value}}' incompatible with datatype '{{datatype}}'."
    fix_suggestion: "Ensure the default value matches the declared datatype (e.g., integer for int, ISO date for date)."

# -----------------------------------------------------------------------------
# Category 2: Mapping-Content Validations (M1–M23)
# -----------------------------------------------------------------------------
mapping_content:
  - id: M1
    category: mapping_content
    check: "Every target column has exactly one mapping row"
    severity: blocker
    applies_to: all
    logic: |
      for each target_table:
        column_counts = count_rows_per_target_column(rows)
        for column, count in column_counts:
          if count != 1:
            return FAIL(column, count)
      return PASS
    error_message: "Target column '{{column}}' in row {{row}} has {{value}} mapping rows (expected exactly 1)."
    fix_suggestion: "Ensure each target column appears in exactly one mapping row. Remove duplicates or add missing mappings."

  - id: M2
    category: mapping_content
    check: "No unmapped target columns remain without explanation"
    severity: blocker
    applies_to: all
    logic: |
      for each target_column in target_schema:
        if target_column not in mapped_columns:
          if target_column not in excluded_with_reason:
            return FAIL(target_column)
      return PASS
    error_message: "Target column '{{column}}' has no mapping row and no documented exclusion reason."
    fix_suggestion: "Add a mapping row for the column, or document why it is intentionally excluded."

  - id: M3
    category: mapping_content
    check: "Source Database populated for non-system/non-derived columns"
    severity: blocker
    applies_to: all
    logic: |
      if source_marker not in ['(system)', '(derived)']:
        if is_empty(source_database):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is missing Source Database."
    fix_suggestion: "Populate the Source Database field with the Athena/Glue database name, or mark as (system)/(derived) if applicable."

  - id: M4
    category: mapping_content
    check: "Source Table Name populated for non-system/non-derived columns"
    severity: blocker
    applies_to: all
    logic: |
      if source_marker not in ['(system)', '(derived)']:
        if is_empty(source_table_name):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is missing Source Table Name."
    fix_suggestion: "Populate the Source Table Name field, or mark the column as (system)/(derived) if it has no physical source."

  - id: M5
    category: mapping_content
    check: "Source Column Name populated for non-system/non-derived columns"
    severity: blocker
    applies_to: all
    logic: |
      if source_marker not in ['(system)', '(derived)']:
        if is_empty(source_column_name):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is missing Source Column Name."
    fix_suggestion: "Populate the Source Column Name field, or mark the column as (system)/(derived) if it has no physical source."

  - id: M6
    category: mapping_content
    check: "Business Logic / Transformation Logic is non-empty for every row"
    severity: blocker
    applies_to: all
    logic: |
      if is_empty(transformation_logic):
        return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has empty Business Logic / Transformation Logic."
    fix_suggestion: "Provide the transformation logic — even for direct mappings, state 'Direct mapping'."

  - id: M7
    category: mapping_content
    check: "Additional Context populated on first data row per target table (table-level metadata only)"
    severity: warning
    applies_to: first_row_per_table
    logic: |
      first_row = get_first_row(target_table)
      if is_empty(first_row.additional_context):
        return FAIL(target_table)
      # All other rows SHOULD be empty
      for row in get_non_first_rows(target_table):
        if not is_empty(row.additional_context):
          return WARN("Row has additional_context but is not the first row — should be empty")
      return PASS
    error_message: "First row for target table '{{value}}' has empty Additional Context."
    fix_suggestion: "Populate Additional Context on the first row only with table-level metadata. Allowed keys: load_type, partition_key, process_frequency, rolling_deletion_predicate, cdc_type, cdc_exclude, validate_unique_keys, duplicates_ts_col, dedup_order. Include only keys with non-empty values. day0_range belongs in Business Logic (J). grain belongs in Target Table Description (L). br_ref belongs in provenance.xlsx."

  - id: M7b
    category: mapping_content
    check: "Additional Context key values match allowed enums (where enums are defined)"
    severity: warning
    applies_to: first_row_per_table
    logic: |
      first_row = get_first_row(target_table)
      if is_empty(first_row.additional_context):
        return PASS  # M7 already covers empty check
      pairs = parse_pipe_delimited(first_row.additional_context)
      allowed_keys = ['load_type', 'partition_key', 'process_frequency', 'rolling_deletion_predicate', 'cdc_type', 'cdc_exclude', 'validate_unique_keys', 'duplicates_ts_col', 'dedup_order']
      enum_definitions = {
        'load_type': ['BAU', 'day1', 'day0', 'full_then_incremental'],
        'cdc_type': ['snapshot', 'delta'],
        'validate_unique_keys': ['true', 'false'],
        'dedup_order': ['desc', 'asc']
      }
      # process_frequency uses recommended values but accepts custom ones
      recommended_values = {
        'process_frequency': ['DAILY', 'WEEKLY_ONCE', 'ONCE_A_MONTH', 'WORKING_DAYS', 'ALTERNATE_DAYS', 'TUE_TO_SAT']
      }
      for key, value in pairs:
        if key not in allowed_keys:
          return WARN(f"Unknown key '{key}' in Additional Context — allowed keys: {allowed_keys}")
        if key in enum_definitions and value not in enum_definitions[key]:
          return WARN(f"Value '{value}' for key '{key}' not in allowed values: {enum_definitions[key]}")
        if key in recommended_values and value not in recommended_values[key]:
          return WARN(f"Value '{value}' for key '{key}' is not a standard DE value ({recommended_values[key]}). Custom values are accepted but may require DE-side configuration.")
      return PASS
    error_message: "Additional Context on first row for table '{{value}}' contains invalid key or value."
    fix_suggestion: "Check key names and values against allowed list. Enum keys: load_type (BAU|day1|day0|full_then_incremental), cdc_type (snapshot|delta), validate_unique_keys (true|false), dedup_order (desc|asc). process_frequency standard values: DAILY|WEEKLY_ONCE|ONCE_A_MONTH|WORKING_DAYS|ALTERNATE_DAYS|TUE_TO_SAT (custom values accepted for non-standard schedules). Free-text keys: partition_key, rolling_deletion_predicate, cdc_exclude, duplicates_ts_col. grain is no longer allowed here — use Target Table Description (L)."

  - id: M8
    category: mapping_content
    check: "Target Table Description on first row only per table"
    severity: blocker
    applies_to: all
    logic: |
      for each target_table:
        first_row = get_first_row(target_table)
        if is_empty(first_row.target_table_description):
          return FAIL(target_table)
        # All other rows SHOULD be empty (warning for backward compat)
        for row in get_non_first_rows(target_table):
          if not is_empty(row.target_table_description):
            return WARN("Non-first row has target_table_description — should be empty (legacy propagation detected)")
      return PASS
    error_message: "Target table '{{value}}' row {{row}}: description must be first row only."
    fix_suggestion: "Populate Target Table Description on the first row only; clear on all subsequent rows for the same table."

  - id: M8b
    category: mapping_content
    check: "Target Table Description contains a Grain statement"
    severity: warning
    applies_to: first_row_per_table
    logic: |
      first_row = get_first_row(target_table)
      if is_empty(first_row.target_table_description):
        return PASS  # M8 already covers empty description check as blocker
      if not regex_search(r'(?i)\bgrain\s*:', first_row.target_table_description):
        return WARN(target_table)
      return PASS
    error_message: "Target table '{{value}}' description does not contain a Grain statement. Grain is essential for downstream consumers to understand the table's uniqueness level."
    fix_suggestion: "Append a Grain statement to the Target Table Description. Format: 'Grain: <key_column1> + <key_column2>[ per effective period].' For SCD2 tables, include 'per effective period'. The sttm-row-generator-agent auto-derives grain when possible; this warning indicates derivation was skipped (e.g., confidence below threshold and guided mode was deferred). Run /sttm-resolve to determine grain interactively."
    notes: >
      This is a WARNING, not a BLOCKER. Some legacy templates may not include
      grain statements. The sttm-row-generator-agent auto-derives grain when possible,
      so this rule primarily catches cases where derivation was skipped.

  - id: M9
    category: mapping_content
    check: "Target Column Description populated for every row"
    severity: blocker
    applies_to: all
    logic: |
      if is_empty(target_column_description):
        return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is missing Target Column Description."
    fix_suggestion: "Add a business-friendly description of what this target column represents."

  - id: M10
    category: mapping_content
    check: "PK columns have Null Flag = N"
    severity: blocker
    applies_to: all
    logic: |
      if key_column == 'Y' and null_flag != 'N':
        return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is marked as Key Column but has Null Flag = '{{value}}' (must be N)."
    fix_suggestion: "Set Null Flag to 'N' for all primary key / business key columns."

  - id: M11
    category: mapping_content
    check: "Key Column = Y for at least one column per table"
    severity: warning
    applies_to: all
    logic: |
      for each target_table:
        if not any(row.key_column == 'Y' for row in table_rows):
          return FAIL(target_table)
      return PASS
    error_message: "Target table '{{value}}' has no column marked as Key Column = Y."
    fix_suggestion: "Mark at least one column as Key Column = 'Y' to define the table's primary/business key."

  - id: M12
    category: mapping_content
    check: "Source column exists in declared source table (if metadata available)"
    severity: blocker
    severity_condition: "blocker when metadata/DDL is available; warning when metadata is unavailable"
    applies_to: all
    skip_when: "source_database == '(file:parquet)' — file sources have no DDL to validate against"
    logic: |
      # Skip for file sources — no DDL/catalog metadata exists for parquet files
      if source_database == '(file:parquet)':
        return PASS
      if metadata_available(source_table):
        if source_column not in get_columns(source_table):
          return FAIL  # BLOCKER — column name is fabricated
      else:
        # Metadata unavailable — downgrade to warning and continue
        return WARN("No metadata available for source_table — cannot verify column existence")
      return PASS
    error_message: "Column '{{column}}' in row {{row}} references source column '{{value}}' which does not exist in the declared source table. When DDL/metadata is available, this is a BLOCKER — the column name may be fabricated."
    fix_suggestion: "Verify the source column name against the source table DDL or metadata. Check for typos, renamed columns, or view alias confusion. If the column was resolved through a view, verify the physical column name in the base table DDL."

  - id: M13
    category: mapping_content
    check: "Source table exists in declared source database (if metadata available)"
    severity: blocker
    severity_condition: "blocker when metadata/DDL is available; warning when metadata is unavailable"
    applies_to: all
    skip_when: "source_database == '(file:parquet)' — file sources have no DDL to validate against"
    logic: |
      # Skip for file sources — no catalog metadata exists for parquet file paths
      if source_database == '(file:parquet)':
        return PASS
      if metadata_available(source_database):
        if source_table not in get_tables(source_database):
          return FAIL  # BLOCKER — table reference is invalid
      else:
        # Metadata unavailable — downgrade to warning and continue
        return WARN("No metadata available for source_database — cannot verify table existence")
      return PASS
    error_message: "Row {{row}} references source table '{{value}}' which does not exist in the declared source database. When DDL/metadata is available, this is a BLOCKER — the table reference may be invalid."
    fix_suggestion: "Verify the source table name against the database catalog or DDL. Check for typos, schema changes, or view-to-base-table resolution errors."

  - id: M14
    category: mapping_content
    check: "Default Value present when COALESCE, NVL, or IFNULL detected in logic"
    severity: warning
    applies_to: all
    logic: |
      logic_lower = lower(transformation_logic)
      if 'coalesce' in logic_lower or 'nvl' in logic_lower or 'ifnull' in logic_lower:
        if is_empty(default_value):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} uses COALESCE/NVL/IFNULL in logic but has no Default Value specified."
    fix_suggestion: "Populate the Default Value field with the fallback value used in the COALESCE, NVL, or IFNULL expression."

  - id: M15
    category: mapping_content
    check: "Multi-table mappings use verbose labeled format with separate Join N Table:, Join N Type:, Join N On:, Join N Filters: lines (not compact single-line format)"
    severity: blocker
    applies_to: all
    logic: |
      if count_distinct_source_tables(row) > 1:
        if not has_structured_join_format(transformation_logic):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} involves multiple source tables but does not use structured compact newline-separated format with aliases."
    fix_suggestion: "Restructure using verbose labeled format: Driver Table: <database>.<table> (<alias>)\\nDriver Conditions: [<conditions>]\\nJoin N Table: <database>.<table> (<alias>)\\nJoin N Type: <type>\\nJoin N On: <alias>.<col> = <alias>.<col>\\nJoin N Filters: [<filters>]\\nValue: <alias>.<expr>"

  - id: M16
    category: mapping_content
    check: "Structured format: Join ON conditions use explicit alias.column {operator} alias.column where operator is =, >, <, >=, <=, BETWEEN, or <>"
    severity: blocker
    applies_to: all
    logic: |
      allowed_operators = ['=', '>', '<', '>=', '<=', '<>', 'BETWEEN']
      for each join_condition in structured_joins:
        # Match alias.column <operator> alias.column (or BETWEEN variant)
        if not regex_match(join_condition, r'^\w+\.\w+\s*(=|>=|<=|<>|>|<)\s*\w+\.\w+$') and \
           not regex_match(join_condition, r'^\w+\.\w+\s+BETWEEN\s+\w+\.\w+\s+AND\s+\w+\.\w+$'):
          return FAIL(join_condition)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has malformed join condition: '{{value}}'. Must be alias.column {operator} alias.column where operator is =, >, <, >=, <=, BETWEEN, or <>."
    fix_suggestion: "Write join conditions with alias on BOTH sides using a supported operator: left_alias.column = right_alias.column, left_alias.column >= right_alias.column, left_alias.column BETWEEN right_alias.col1 AND right_alias.col2, etc."

  - id: M17
    category: mapping_content
    check: "Structured format: Join N Type is exactly one of LEFT, INNER, RIGHT, FULL, CROSS, CROSS_APPLY, OUTER_APPLY, LATERAL"
    severity: blocker
    applies_to: all
    logic: |
      for each join in structured_joins:
        if upper(trim(join.type)) not in ['LEFT', 'INNER', 'RIGHT', 'FULL', 'CROSS', 'CROSS_APPLY', 'OUTER_APPLY', 'LATERAL']:
          return FAIL(join.type)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has invalid Join Type: '{{value}}'. Must be LEFT, INNER, RIGHT, FULL, CROSS, CROSS_APPLY, OUTER_APPLY, or LATERAL."
    fix_suggestion: "Set Join Type to exactly one of: LEFT, INNER, RIGHT, FULL, CROSS, CROSS_APPLY, OUTER_APPLY, LATERAL."

  - id: M18
    category: mapping_content
    check: "When source SQL has WHERE/HAVING clauses, multi-table Business Logic reflects those filters in structured format"
    severity: blocker
    applies_to: multi_table_only
    logic: |
      # Only applies when source SQL genuinely has WHERE/HAVING/QUALIFY clauses
      # If no filter exists in source SQL (full table load), this rule does NOT fire
      # Use filters_extracted from lineage cache as the primary signal
      if not source_sql_has_filters(code_artifacts, filters_extracted):
        return PASS  # No filter in SQL = legitimate full-table read, not an error
      if count_distinct_source_tables(row) > 1:
        has_driver_conditions = 'Driver Conditions:' in transformation_logic
        has_filter_suffix = '[Filter ' in transformation_logic
        has_having = 'Having:' in transformation_logic
        has_qualify = 'Qualify:' in transformation_logic
        if not (has_driver_conditions or has_filter_suffix or has_having or has_qualify):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}}: source SQL has WHERE/HAVING filters but Business Logic has no filter documentation (expected Driver Conditions:, [Filter ...], Having:, or Qualify: in structured format)."
    fix_suggestion: "Add filter conditions to Business Logic: 'Driver Conditions: [Filter alias.col = value]' for driver table filters, or '[Filter alias.col = value]' suffix on Join lines for joined table filters."
    notes: >
      This rule only fires when the source SQL actually contains WHERE/HAVING/QUALIFY clauses.
      If data is loaded from source without any row reduction (full table), empty
      Driver Conditions: [] is correct and this rule will PASS.
      Uses filters_extracted from lineage cache as the primary signal.
    implementation_note: >
      source_sql_has_filters should use filters_extracted from the lineage cache
      (output/.intermediate/lineage_cache.json) as the primary signal:
      - Check filters_extracted.where_clauses is non-empty
      - Check filters_extracted.having_clauses is non-empty
      - Check filters_extracted.qualify_clauses is non-empty
      If filters_extracted is unavailable (backward compat), fall back to
      scanning code_artifacts for WHERE/HAVING/QUALIFY keywords outside of
      comments and string literals.

  - id: M18b
    category: mapping_content
    check: "When source SQL has WHERE/HAVING/QUALIFY clauses, single-source Business Logic reflects those filters via Conditions suffix"
    severity: warning
    applies_to: single_source_with_filters
    logic: |
      # Applies to single-source rows when SQL has filters
      if not source_sql_has_filters(code_artifacts, filters_extracted):
        return PASS
      if count_distinct_source_tables(row) == 1:
        if 'Conditions:' not in transformation_logic:
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}}: source SQL has WHERE/HAVING/QUALIFY filters but single-source Business Logic has no Conditions suffix."
    fix_suggestion: "Append filter conditions to Business Logic: 'Direct mapping\\nConditions: <exact SQL predicate>' or '<expression>\\nConditions: <exact SQL predicate>'."
    notes: >
      New rule for single-source filtered queries. Applies when the source SQL has
      WHERE/HAVING/QUALIFY clauses but the row only references one source table.
      Complements M18 which covers multi-table scenarios.

  - id: M19
    category: mapping_content
    check: "When source SQL contains JOINs, all joined tables appear in structured Business Logic AND all joins_detected tables appear in at least one row's source_table_name"
    severity: blocker
    applies_to: multi_source_only
    logic: |
      # Only fires when source SQL actually has JOIN clauses
      # Single-source-table mappings (no JOIN in SQL) are NOT affected by this rule
      sql_join_tables = get_join_tables_from_sql(code_artifacts)
      if len(sql_join_tables) == 0:
        return PASS  # Single source table — no JOINs expected, not an error

      # Check 1 (original): All joined tables appear in structured Business Logic
      for row in get_rows_with_multi_source():
        logic_join_tables = extract_join_tables_from_logic(row.transformation_logic)
        missing = sql_join_tables - logic_join_tables
        if len(missing) > 0:
          return FAIL(f"Business Logic missing tables: {missing}")

      # Check 2 (new — joined-table completeness): All tables from joins_detected
      # must appear in at least one row's source_table_name across all mapping rows.
      # This catches cases where a table participates in a JOIN but no column from it
      # is attributed to any target column (e.g., inline view base tables, filter-only tables).
      all_source_tables_in_rows = set()
      for row in mapping_rows:
        if row.source_table_name not in ['(system)', '(derived)', 'N/A', '']:
          for table_ref in split_comma(row.source_table_name):
            all_source_tables_in_rows.add(trim(table_ref))
      joins_detected_tables = get_all_tables_from_joins_detected()  # driver + all joined tables
      missing_from_rows = joins_detected_tables - all_source_tables_in_rows
      if len(missing_from_rows) > 0:
        return FAIL(f"Tables in joins_detected but not in any row's source_table_name: {missing_from_rows}")

      return PASS
    error_message: "Business Logic is missing JOIN tables found in source SQL: {{value}}."
    fix_suggestion: "Add all joined tables from source SQL to the structured format: 'Join N Table: <table>' for each joined table. Ensure every table from joins_detected appears in at least one row's source_table_name (columns G/H) — including tables from inline views resolved to their base tables."
    notes: >
      This rule only applies when the source SQL contains explicit JOIN clauses.
      Single-source-table scenarios (SELECT from one table only) will NOT trigger
      this rule — JOINs are not expected when data comes from a single source.
      Check 2 catches incomplete source attribution — e.g., when an inline view
      (REPLACE VIEW charge_off_v) resolves to t_trmfdb.charge_off but that base
      table never appears in any row's source_table_name.

  - id: M20
    category: mapping_content
    check: "source_database and source_table must reference real tables unless column is purely self-referential or system-generated"
    severity: blocker
    applies_to: all
    logic: |
      # PASS conditions: source_database is a real database name, or is (system) for audit columns
      if source_database not in ['(derived)', '(system)']:
        return PASS  # Real source referenced — correct
      if source_database == '(system)':
        # Only valid for dw_lod_tmp, dw_bus_dt, and dw_upd_lod_tmp
        if target_column_name in ['dw_lod_tmp', 'dw_bus_dt', 'dw_upd_lod_tmp']:
          return PASS
        else:
          return FAIL("(system) only valid for audit timestamp columns")
      # source_database == '(derived)' — verify it's truly self-referential
      if source_database == '(derived)' and source_table == '(derived)':
        logic_lower = lower(transformation_logic)
        # Check 1: Business logic references source tables or databases
        if regex_match(logic_lower, r'\b\w+_db\b') or regex_match(logic_lower, r'\bdriver table\b'):
          return FAIL("logic references source tables but source_database=(derived)")
        # Check 2: Aggregation/window signals (require source table reads)
        source_signals = [
          'lag(', 'lead(', 'row_number(', 'rank(', 'dense_rank(',
          'sum(', 'count(', 'avg(', 'max(', 'min(',
          'prior_period', 'prior_month', 'historical', 'baseline',
          'over (partition', 'over(partition',
          'join', 'lookup', 'br-'
        ]
        for signal in source_signals:
          if signal in logic_lower:
            return FAIL(signal)
        # Check 3: Hardcoded values that exist in context of a data flow
        if 'hardcoded' in logic_lower or source_column == 'Hardcoded':
          return FAIL("hardcoded values in a data flow must reference the driving source table")
        # Check 4: Verify it's genuinely self-referential (references only same-row target columns)
        # If logic references column names that exist in the target table, likely OK
        return PASS
      return PASS
    error_message: >
      Column '{{column}}' in row {{row}} has source_database='(derived)' but
      its Business Logic indicates dependency on source tables (signal: '{{value}}').
      source_database and source_table must always reference the real driving/contributing
      tables. Only source_column may be (derived) for calculated outputs.
    fix_suggestion: >
      Set source_database to the primary contributing database, source_table to
      the main driver table that creates/drives the data flow for this row.
      Set source_column to '(derived)' if the value is calculated, or 'Hardcoded'
      if constant. Rewrite Business Logic using structured compact newline-separated format
      with table aliases, listing all contributing tables with their join conditions.
    notes: >
      source_database and source_table answer "WHERE does data flow from?" and must
      always trace to real tables for lineage and impact analysis. (derived)/(derived)
      is ONLY valid when the column is computed purely from other columns already in
      the same target row (e.g., active flag from eff_end_date). Hardcoded values
      still need the driving source table referenced to maintain data flow traceability.

