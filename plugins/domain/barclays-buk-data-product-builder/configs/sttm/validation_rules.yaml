      This rule catches view names leaking into the operational Business Logic
      (Driver Table / Join N / Value lines) instead of being resolved to base tables.
      View names are expected and correct in the Transformation Lineage block
      (after the --- divider) where they document the view resolution chain.
      The fix is upstream: the sttm-sql-lineage-agent should resolve joins_detected
      table names to base tables, and sttm-generate should apply the view_to_base_table
      lookup during join chain assembly.

  - id: M42
    category: mapping_content
    check: "UNION branches must have matching column count and order"
    severity: blocker
    applies_to: union
    logic: |
      if union_metadata and union_metadata.is_union:
        for row in mapping_rows:
          if 'Union Branch' in row.business_logic:
            branch_columns = extract_union_branch_columns(row.business_logic)
            if len(set(len(cols) for cols in branch_columns.values())) > 1:
              return FAIL(row.target_column_name, branch_columns)
      return PASS
    error_message: "Column '{{column}}' UNION branches have mismatched column counts: {{value}}."
    fix_suggestion: "Ensure all UNION branches list the same number of columns in the same order. Add aliases (AS) where column names differ between branches."

  - id: M43
    category: mapping_content
    check: "All tables in Business Logic must appear in Source Table (Column H)"
    severity: blocker
    applies_to: all
    logic: |
      for row in mapping_rows:
        if row.source_table_name in ['(system)', '(derived)', 'N/A', '']:
          continue
        logic_tables = extract_tables_from_business_logic(row.business_logic)
        source_tables = set(split_comma(row.source_table_name))
        missing = logic_tables - source_tables
        if len(missing) > 0:
          return FAIL(row.target_column_name, missing)
      return PASS
    error_message: "Column '{{column}}' Business Logic references tables not in Source Table (Column H): {{value}}."
    fix_suggestion: "Add all tables referenced in Business Logic to Source Table (Column H), comma-separated. Driver table first, then joined tables in join order."

  - id: M44
    category: mapping_content
    check: "All columns in Value: expression must appear in Source Column (Column I) or be system/derived"
    severity: blocker
    applies_to: all
    logic: |
      for row in mapping_rows:
        if row.source_column_name in ['(system)', '(derived)', 'Hardcoded', 'N/A', '']:
          continue
        value_columns = extract_columns_from_value_expression(row.business_logic)
        source_columns = set(split_comma(row.source_column_name))
        missing = value_columns - source_columns - {'(system)', '(derived)', 'Hardcoded'}
        if len(missing) > 0:
          return FAIL(row.target_column_name, missing)
      return PASS
    error_message: "Column '{{column}}' Value: expression references columns not in Source Column (Column I): {{value}}."
    fix_suggestion: "Add all contributing source columns to Source Column (Column I) in 3-part FQN format ({database}.{table}.{column}), comma-separated."

  - id: M45
    category: mapping_content
    check: "Window/Dedup metadata labels required when ROW_NUMBER/RANK/LAG/LEAD present in Value"
    severity: blocker
    applies_to: all
    logic: |
      window_functions = ['ROW_NUMBER', 'RANK', 'DENSE_RANK', 'LAG', 'LEAD', 'NTILE', 'FIRST_VALUE', 'LAST_VALUE']
      for row in mapping_rows:
        logic_upper = upper(row.business_logic)
        for func in window_functions:
          if func + '(' in logic_upper or func + ' (' in logic_upper:
            if 'Window Function:' not in row.business_logic and 'Window Partition:' not in row.business_logic and 'Dedup Strategy:' not in row.business_logic:
              return FAIL(row.target_column_name, func)
      return PASS
    error_message: "Column '{{column}}' uses window function '{{value}}' but has no Window Function/Partition/Dedup metadata labels."
    fix_suggestion: "Add explicit metadata labels: 'Window Function:', 'Window Partition:', 'Window Order:' (or 'Dedup Strategy:', 'Dedup Partition:', 'Dedup Order:' for dedup patterns)."

  - id: M46
    category: mapping_content
    check: "Aggregate Group By required when SUM/COUNT/AVG/MIN/MAX present in Value expression"
    severity: blocker
    applies_to: all
    logic: |
      aggregate_functions = ['SUM(', 'COUNT(', 'AVG(', 'MIN(', 'MAX(', 'COUNT(DISTINCT']
      for row in mapping_rows:
        logic_upper = upper(row.business_logic)
        has_aggregate = any(func in logic_upper for func in aggregate_functions)
        if has_aggregate:
          if 'Aggregate Group By:' not in row.business_logic and 'Aggregate Function:' not in row.business_logic:
            if 'OVER' not in logic_upper and 'Window Function:' not in row.business_logic:
              return FAIL(row.target_column_name)
      return PASS
    error_message: "Column '{{column}}' uses aggregate function but has no 'Aggregate Group By:' or 'Aggregate Function:' label."
    fix_suggestion: "Add 'Aggregate Function:' and 'Aggregate Group By:' labels after the Value: line. Exception: aggregates inside window OVER() clauses do not need GROUP BY."

  - id: M47
    category: mapping_content
    check: "Multi-step Transformation Lineage: every step must have Operation, Grain, Destination"
    severity: blocker
    applies_to: multi_step_only
    logic: |
      if intermediate_steps is non-empty:
        first_key_row = get_first_row_with_key_column_Y()
        if first_key_row and 'Transformation Lineage:' in first_key_row.transformation_logic:
          lineage_text = first_key_row.transformation_logic
          steps = extract_steps_from_lineage(lineage_text)
          for step in steps:
            if 'Operation:' not in step:
              return FAIL(step.number, "missing Operation:")
            if 'Grain:' not in step:
              return FAIL(step.number, "missing Grain:")
            if 'Destination:' not in step:
              return FAIL(step.number, "missing Destination:")
      return PASS
    error_message: "Step {{step_number}} in Transformation Lineage is missing required field: {{value}}."
    fix_suggestion: "Every step in Transformation Lineage MUST have Operation:, Grain:, and Destination: labels. Operation must be one of: INSERT_SELECT, UPDATE, DELETE, TRUNCATE, MERGE, RENAME, CREATE_VIEW."

  - id: M48
    category: mapping_content
    check: "Multi-step Column roles must be valid enum values"
    severity: blocker
    applies_to: multi_step_only
    logic: |
      valid_roles = ['[New]', '[Transformed]', '[Pass-through]', '[Replace]', '[Additive]', '[Conditional]', '[New, Infrastructure]']
      if intermediate_steps is non-empty:
        first_key_row = get_first_row_with_key_column_Y()
        if first_key_row and 'Transformation Lineage:' in first_key_row.transformation_logic:
          roles = extract_column_roles(first_key_row.transformation_logic)
          for role in roles:
            if role not in valid_roles:
              return FAIL(role)
      return PASS
    error_message: "Transformation Lineage contains invalid column role: '{{value}}'. Valid roles: [New], [Transformed], [Pass-through], [Replace], [Additive], [Conditional], [New, Infrastructure]."
    fix_suggestion: "Use one of the valid column roles: [New] for new columns, [Transformed] for modified columns, [Pass-through] for unchanged, [Replace] for overwritten, [Additive] for accumulated, [Conditional] for CASE-based, [New, Infrastructure] for dedup/ordering columns."

  - id: M49
    category: mapping_content
    check: "Crypto DE name must match standard naming pattern"
    severity: blocker
    applies_to: all
    logic: |
      crypto_de_pattern = r'(UK|US|APAC)_TOK_.+_L\dR\d_.+_DE'
      for row in mapping_rows:
        if 'Crypto DE:' in row.business_logic or 'Crypto Source DE:' in row.business_logic or 'Crypto Target DE:' in row.business_logic:
          de_names = extract_crypto_de_names(row.business_logic)
          for de_name in de_names:
            if not regex_match(de_name, crypto_de_pattern):
              return FAIL(row.target_column_name, de_name)
        if 'cloud_api_udf_' in row.business_logic:
          udf_de_names = extract_de_from_udf(row.business_logic)
          for de_name in udf_de_names:
            if not regex_match(de_name, crypto_de_pattern):
              return FAIL(row.target_column_name, de_name)
      return PASS
    error_message: "Column '{{column}}' has non-standard Crypto DE name: '{{value}}'. Must match pattern (UK|US|APAC)_TOK_*_L{n}R{n}_*_DE."
    fix_suggestion: "Use the standard DE naming pattern: {region}_TOK_{data_element}_{level}_DE, e.g., UK_TOK_SORTCOD_L0R0_NUM_DE."

  - id: M50
    category: mapping_content
    check: "All alias references in expressions must be defined in Driver Table / Join N Table lines"
    severity: blocker
    applies_to: all
    logic: |
      for row in mapping_rows:
        if 'Driver Table:' not in row.business_logic:
          continue
        defined_aliases = extract_defined_aliases(row.business_logic)
        used_aliases = extract_used_aliases_in_expressions(row.business_logic)
        undefined = used_aliases - defined_aliases
        if len(undefined) > 0:
          return FAIL(row.target_column_name, undefined)
      return PASS
    error_message: "Column '{{column}}' uses undefined aliases in expressions: {{value}}. All aliases must be defined in Driver Table / Join N Table lines."
    fix_suggestion: "Define all table aliases in the structured format lines. Each alias appears in parentheses after the table name: 'Driver Table: database.table (alias)' or 'Join N Table: database.table (alias)'."

  - id: M51
    category: mapping_content
    check: "Source Table (Column H) must not contain view names found in intermediate_steps CREATE_VIEW entries"
    severity: blocker
    applies_to: multi_step_only
    logic: |
      if intermediate_steps is non-empty:
        view_names = [s.temp_table_name for s in intermediate_steps if s.statement_type == 'CREATE_VIEW']
        if len(view_names) == 0:
          return PASS
        for row in mapping_rows:
          if row.source_table_name in ['(system)', '(derived)', 'N/A', '']:
            continue
          for table_ref in split_comma(row.source_table_name):
            table_ref = trim(table_ref)
            if table_ref in view_names:
              return FAIL(row.target_column_name, table_ref)
      return PASS
    error_message: "Column '{{column}}' Source Table references view '{{value}}' instead of its resolved base table. Views must be resolved to physical base tables in Column H."
    fix_suggestion: "Replace the view name with its resolved base table from intermediate_steps[].resolves_to_base_tables. For example, replace 'l_bcs_loaddb.prior_cycle_v' with 's_trmfdb.ctcp'."

  - id: M52
    category: mapping_content
    check: "Source Column (Column I) must use physical base table column names, not view aliases"
    severity: blocker
    applies_to: multi_step_only
    logic: |
      if intermediate_steps is non-empty:
        view_steps = [s for s in intermediate_steps if s.statement_type == 'CREATE_VIEW']
        if len(view_steps) == 0:
          return PASS
        view_alias_map = {}
        for step in view_steps:
          for col in step.columns_produced:
            if col.column_name != col.expression.split('.')[-1]:
              view_alias_map[col.column_name] = col.expression
        for row in mapping_rows:
          if row.source_column_name in ['(system)', '(derived)', 'Hardcoded', 'N/A', '']:
            continue
          for col_ref in split_comma(row.source_column_name):
            col_ref = trim(col_ref)
            parts = col_ref.split('.')
            if len(parts) == 3:
              col_name = parts[2]
              if col_name in view_alias_map:
                return FAIL(row.target_column_name, col_name, view_alias_map[col_name])
      return PASS
    error_message: "Column '{{column}}' Source Column uses view alias '{{value}}' instead of physical column name '{{physical}}'. Use the base table physical column name."
    fix_suggestion: "Replace the view alias with the physical column name from the base table DDL. View column aliases are documented in the CREATE_VIEW intermediate step's columns_produced block."

  - id: M53
    category: mapping_content
    check: "CDC keys must not appear in Additional Context for non-SCD2 tables"
    severity: blocker
    applies_to: all
    logic: |
      first_row = get_first_row(target_table)
      if is_empty(first_row.additional_context):
        return PASS
      table_type = get_table_type_classification()
      if table_type == 'NonTransactional_SCD2':
        return PASS  # CDC keys are expected for SCD2
      cdc_keys = ['cdc_type', 'cdc_exclude', 'validate_unique_keys', 'duplicates_ts_col', 'dedup_order']
      pairs = parse_pipe_delimited(first_row.additional_context)
      for key, value in pairs:
        if key in cdc_keys:
          return FAIL(key, table_type)
      return PASS
    error_message: "Additional Context for {{table_type}} table contains CDC key '{{value}}'. CDC keys (cdc_type, cdc_exclude, validate_unique_keys, duplicates_ts_col, dedup_order) are arguments to Databricks run_cdc() and only applicable to NonTransactional_SCD2 tables."
    fix_suggestion: "Remove CDC-related keys from Additional Context. These keys are run_cdc() function arguments — only NonTransactional_SCD2 tables invoke run_cdc(). Allowed keys for Transactional: load_type, partition_key, process_frequency, rolling_deletion_predicate. Allowed keys for SCD1: load_type, partition_key, process_frequency, rolling_deletion_predicate."

  - id: M54
    category: mapping-content
    severity: warning
    description: "source_system value should be consistent for tables from the same source database"
    rule: "When source_system is declared in Additional Context, verify that all mapping tables sourced from the same database use the same source_system label. Mismatched labels for the same database may indicate a configuration error."
    applies_when: "source_system_hint is non-null for any table in the mapping"

# -----------------------------------------------------------------------------
# Category 3: Scenario-Specific Validations (SC1–SC19)
# -----------------------------------------------------------------------------
scenario_specific:
  - id: SC1
    category: scenario_specific
    check: "SCD2 tables have eff_start_date, eff_end_date, active columns"
    severity: blocker
    applies_to:
      axis: table_type
      value: NonTransactional_SCD2
    logic: |
      required_columns = ['eff_start_date', 'eff_end_date', 'active']
      table_columns = get_target_columns(target_table)
      for col in required_columns:
        if col not in table_columns:
          return FAIL(col)
      return PASS
    error_message: "SCD2 table '{{value}}' is missing required column '{{column}}'."
    fix_suggestion: "Add the missing SCD2 control column (eff_start_date, eff_end_date, or active) to the target table."

  - id: SC2
    category: scenario_specific
    check: "eff_end_date logic references configured high-end date"
    severity: blocker
    applies_to:
      axis: table_type
      value: NonTransactional_SCD2
    logic: |
      eff_end_row = get_row_for_column('eff_end_date')
      if configured_high_end_date not in eff_end_row.transformation_logic:
        return FAIL
      return PASS
    error_message: "Column 'eff_end_date' in row {{row}} does not reference the configured high-end date '{{value}}'."
    fix_suggestion: "Include the high-end date constant (e.g., '3499-12-31') in the eff_end_date transformation logic."

  - id: SC3
    category: scenario_specific
    check: "active flag logic derives from eff_end_date comparison"
    severity: blocker
    applies_to:
      axis: table_type
      value: NonTransactional_SCD2
    logic: |
      active_row = get_row_for_column('active')
      if 'eff_end_date' not in active_row.transformation_logic:
        return FAIL
      return PASS
    error_message: "Column 'active' in row {{row}} does not derive from eff_end_date comparison. Logic: '{{value}}'."
    fix_suggestion: "The 'active' flag should be derived by comparing eff_end_date to the high-end date (e.g., CASE WHEN eff_end_date = CAST('3499-12-31' AS DATE) THEN '1' ELSE '0' END)."

  - id: SC4
    category: scenario_specific
    check: "eff_start_date has a real source column (not system-generated)"
    severity: warning
    applies_to:
      axis: table_type
      value: NonTransactional_SCD2
    logic: |
      eff_start_row = get_row_for_column('eff_start_date')
      if eff_start_row.source_marker in ['(system)', '(derived)']:
        return FAIL
      if is_empty(eff_start_row.source_column_name):
        return FAIL
      return PASS
    error_message: "Column 'eff_start_date' in row {{row}} appears to be system-generated rather than sourced from data."
    fix_suggestion: "Map eff_start_date to an actual source timestamp/date column that indicates when the record became effective."

  - id: SC5
    category: scenario_specific
    check: "Transactional tables do NOT have eff_start/end/active columns"
    severity: warning
    applies_to:
      axis: table_type
      value: Transactional
    logic: |
      scd2_columns = ['eff_start_date', 'eff_end_date', 'active']
      table_columns = get_target_columns(target_table)
      for col in scd2_columns:
        if col in table_columns:
          return FAIL(col)
      return PASS
    error_message: "Transactional table '{{value}}' contains SCD2 column '{{column}}' which should not be present."
    fix_suggestion: "Remove SCD2 control columns (eff_start_date, eff_end_date, active) from transactional tables, or reclassify as SCD2."

  - id: SC6
    category: scenario_specific
    check: "Crypto columns have valid DE name in expression"
    severity: blocker
    applies_to:
      axis: crypto_aspect
      value:
        - Tokenize
        - Detokenize
        - Both
    logic: |
      if is_crypto_column(row):
        de_name = extract_de_name(transformation_logic)
        if de_name is None or de_name not in valid_de_names:
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has crypto logic but no valid Data Element (DE) name found in expression: '{{value}}'."
    fix_suggestion: "Include a valid DE name in the crypto UDF expression (e.g., cloud_api_udf_CUSTOMER_NAME_protect)."

  - id: SC7
    category: scenario_specific
    check: "Crypto UDF naming follows convention: cloud_api_udf_{DE}_{protect|unprotect}"
    severity: blocker
    applies_to:
      axis: crypto_aspect
      value:
        - Tokenize
        - Detokenize
        - Both
    logic: |
      if is_crypto_column(row):
        udf_call = extract_udf_name(transformation_logic)
        if not regex_match(udf_call, r'^cloud_api_udf_[A-Z_]+_(protect|unprotect)$'):
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has non-standard crypto UDF name: '{{value}}'. Expected pattern: cloud_api_udf_{DE}_{protect|unprotect}."
    fix_suggestion: "Rename the UDF to follow the convention: cloud_api_udf_{DATA_ELEMENT}_{protect|unprotect}."

  - id: SC8
    category: scenario_specific
    check: "Re-tokenize (both) has source DE != target DE"
    severity: blocker
    applies_to:
      axis: crypto_aspect
      value: Both
    logic: |
      source_de = extract_source_de(transformation_logic)
      target_de = extract_target_de(transformation_logic)
      if source_de == target_de:
        return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is marked crypto_both but source DE '{{value}}' equals target DE. Re-tokenization requires different DEs."
    fix_suggestion: "Ensure the unprotect DE (source) differs from the protect DE (target) for re-tokenization scenarios."

  - id: SC9
    category: scenario_specific
    check: "Multi-source: all source references fully qualified"
    severity: blocker
    applies_to:
      cross_axis: true
      condition: "multiple source tables or LEFT JOIN detected in lineage"
    logic: |
      for each source_ref in extract_source_references(transformation_logic):
        if not is_fully_qualified(source_ref):  # database.table.column
          return FAIL(source_ref)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has unqualified source reference: '{{value}}'. Multi-source requires full qualification."
    fix_suggestion: "Use fully qualified references (database.table.column) for all source references in multi-source mappings."

  - id: SC10
    category: scenario_specific
    check: "Multi-source: LEFT JOIN columns have Null Flag = Y"
    severity: warning
    applies_to:
      cross_axis: true
      condition: "multiple source tables or LEFT JOIN detected in lineage"
    logic: |
      if source_comes_from_left_join_side(row):
        if null_flag != 'Y':
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} sources from LEFT JOIN right-side but Null Flag is '{{value}}' (should be Y)."
    fix_suggestion: "Set Null Flag to 'Y' for columns sourced from the non-preserved side of a LEFT JOIN (they may be null when no match)."

  - id: SC11
    category: scenario_specific
    check: "Aggregation: PARTITION BY clause present and valid"
    severity: warning
    applies_to:
      cross_axis: true
      condition: "aggregate functions present in transformation logic"
    logic: |
      if is_window_or_aggregate(transformation_logic):
        # Exception: GROUP BY used for dedup (all selected columns in GROUP BY,
        # no aggregate functions) is treated as DISTINCT and does NOT trigger this rule
        if is_group_by_dedup(transformation_logic):
          selected_cols = extract_selected_columns(transformation_logic)
          group_by_cols = extract_group_by_columns(transformation_logic)
          aggregate_funcs = extract_aggregate_functions(transformation_logic)
          if set(selected_cols) <= set(group_by_cols) and len(aggregate_funcs) == 0:
            return PASS  # Dedup via GROUP BY — equivalent to DISTINCT
        if 'partition by' not in lower(transformation_logic):
          return FAIL
        partition_cols = extract_partition_columns(transformation_logic)
        if len(partition_cols) == 0:
          return FAIL
      return PASS
    error_message: "Column '{{column}}' in row {{row}} uses aggregation but has no valid PARTITION BY clause: '{{value}}'."
    fix_suggestion: "Add a PARTITION BY clause specifying the grouping columns for the window/aggregate function."
    notes: >
      Exception: If all selected columns appear in GROUP BY AND no aggregate functions
      are present, this is dedup (equivalent to DISTINCT), not aggregation — SC11 does
      not apply in that case.

  - id: SC12
    category: scenario_specific
    check: "UNION queries have all branches documented in Business Logic"
    severity: warning
    applies_to: union
    logic: |
      if union_metadata and union_metadata.branch_count > 0:
        business_logic_mentions_all_branches = all branches referenced
        return PASS if all documented else FAIL
    error_message: "UNION query has {{branch_count}} branches but Business Logic does not document all of them"
    fix_suggestion: "Use the UNION Structured Format: Union Branch 1: ... Union Branch 2: ... for each UNION branch."

  - id: SC13
    category: scenario_specific
    check: "Self-join columns use distinct aliases to disambiguate same-table references"
    severity: warning
    applies_to: self_join
    logic: |
      if same table appears multiple times in joins_detected:
        verify aliases are unique and source_column references are unambiguous
    error_message: "Self-join on table '{{table}}' uses ambiguous aliases in row {{row}}"
    fix_suggestion: "Use role-reflecting aliases (e.g., account_curr, account_prev) for self-joins."

  - id: SC14
    category: scenario_specific
    check: "Non-equi JOIN columns from non-driving side have Null Flag = Y when LEFT/FULL join"
    severity: warning
    applies_to: non_equi_join
    logic: |
      same as SC10 but extended to non-equi joins
    error_message: "Column '{{column}}' sourced from non-equi LEFT/FULL JOIN should have Null Flag = Y"
    fix_suggestion: "Set Null Flag to 'Y' for columns from the non-driving side of a non-equi LEFT or FULL join."

  - id: SC15
    category: scenario_specific
    check: "FULL OUTER JOIN columns have Null Flag = 'Y' on both sides"
    severity: warning
    applies_to: full_outer_join
    logic: |
      if FULL OUTER JOIN detected in joins_detected:
        for column in lineage where source_table is on either side of the FULL JOIN:
          if null_flag != 'Y':
            return FAIL(column)
    error_message: "Column '{{column}}' in row {{row}} sourced from FULL OUTER JOIN but Null Flag is '{{value}}' — both sides of a FULL JOIN can produce NULLs"
    fix_suggestion: "Set Null Flag to 'Y' for all columns sourced from either side of a FULL OUTER JOIN."

  - id: SC16
    category: scenario_specific
    check: "No nested protect(protect(col)) double-encryption patterns"
    severity: blocker
    applies_to:
      axis: crypto_aspect
      value: [Tokenize, Both]
    logic: |
      for row in mapping_rows:
        if regex_match(business_logic, r'cloud_api_udf_\w+_protect\s*\(\s*cloud_api_udf_\w+_protect'):
          return FAIL(row)
    error_message: "Column '{{column}}' in row {{row}} has double-protect pattern: '{{value}}'. This is almost always accidental — intended re-tokenization uses protect(unprotect(col))."
    fix_suggestion: "Remove the inner protect() call. For re-tokenization, use protect(unprotect(col)) with source DE ≠ target DE."

  - id: SC17
    category: scenario_specific
    check: "No crypto UDF calls inside aggregate function arguments"
    severity: blocker
    applies_to:
      axis: crypto_aspect
      value: [Tokenize, Detokenize, Both]
    logic: |
      for row in mapping_rows:
        if regex_match(business_logic, r'(SUM|AVG|COUNT|MAX|MIN)\s*\(.*cloud_api_udf_\w+_(protect|unprotect)'):
          return FAIL(row)
    error_message: "Column '{{column}}' in row {{row}} has crypto UDF inside aggregate function: '{{value}}'. Aggregation on tokenized data produces meaningless results."
    fix_suggestion: "Aggregate on clear/source values first, then apply crypto to the result: cloud_api_udf_{DE}_protect(CAST(SUM(amount) AS STRING))."

  - id: SC18
    category: scenario_specific
    check: "System function columns use source = (system) or (derived)"
    severity: warning
    applies_to: all
    logic: |
      system_functions = ['CURRENT_DATE', 'CURRENT_TIMESTAMP', 'NOW()', 'GETDATE()', 'UUID()', 'MONOTONICALLY_INCREASING_ID()', 'CURRENT_USER', 'SESSION_USER']
      for row in mapping_rows:
        if business_logic is purely a system function (no source column reference):
          if source_database not in ['(system)', '(derived)']:
            return FAIL(row)
    error_message: "Column '{{column}}' in row {{row}} uses system function '{{value}}' but has a real source database specified instead of (system) or (derived)"
    fix_suggestion: "Set source_database to '(system)' and source_table to '(system)' for pure system functions (CURRENT_TIMESTAMP, UUID), or '(derived)' for positional functions (ROW_NUMBER with source column references in OVER clause)."

  - id: SC19
    category: scenario_specific
    check: "No unresolved NATURAL JOIN columns in output"
    severity: blocker
    applies_to: all
    logic: |
      for entry in lineage:
        if entry.evidence contains 'natural_join_unresolved':
          return FAIL(entry)
    error_message: "Column '{{column}}' in row {{row}} was matched via NATURAL JOIN but the matched column list is unconfirmed — cannot guarantee correct lineage"
    fix_suggestion: "Convert NATURAL JOIN to explicit JOIN with ON clause, or confirm the matched columns via guided mode (Q32)."

  - id: SC20
    category: scenario_specific
    check: "SCD2 tables: Transformation Lineage steps must not include 'active' column in Set Columns (reserved for SCD2 framework)"
    severity: warning
    applies_to:
      axis: table_type
      value: NonTransactional_SCD2
    logic: |
      if intermediate_steps is non-empty:
        first_key_row = get_first_row_with_key_column_Y()
        if first_key_row and 'Transformation Lineage:' in first_key_row.transformation_logic:
          lineage_text = first_key_row.transformation_logic
          steps = extract_steps_from_lineage(lineage_text)
          for step in steps:
            if 'Set Columns:' in step:
              set_cols = extract_set_columns(step)
              if 'active' in set_cols:
                return FAIL(step.number)
      return PASS
    error_message: "Step {{step_number}} includes 'active' in Set Columns — this column is managed by the SCD2 framework and should not be overridden in transformation steps."
    fix_suggestion: "Remove 'active' from Set Columns. The SCD2 framework automatically derives active = CASE WHEN eff_end_date = '3499-12-31' THEN '1' ELSE '0' END."

# -----------------------------------------------------------------------------
# Category 4: Artifact-Consistency Validations (A1–A7)
# Note: A2 merged into A3, M26 merged into M25. Rule IDs are stable — gaps are intentional.
# -----------------------------------------------------------------------------
artifact_consistency:
  - id: A1
    category: artifact_consistency
    check: "SQL-derived mappings aligned with declared target columns (no orphan extractions)"
    severity: warning
    applies_to: all
    logic: |
      sql_extracted_targets = extract_targets_from_sql(sql_artifacts)
      declared_targets = get_declared_target_columns()
      orphans = sql_extracted_targets - declared_targets
      if len(orphans) > 0:
        return FAIL(orphans)
      return PASS
    error_message: "SQL artifacts produce columns not declared in target schema: '{{value}}'."
    fix_suggestion: "Either add the orphan columns to the target schema or remove them from the SQL. Reconcile extraction with declaration."

  - id: A3
    category: artifact_consistency
    check: "Profiling null% does not contradict null flag without explanation"
    severity: warning
    applies_to: all
    logic: |
      if profiling_available(source_column):
        null_pct = get_null_percentage(source_column)
        if null_flag == 'N' and null_pct > 0:
          if not has_coalesce_or_default(transformation_logic, default_value):
            return FAIL(null_pct)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} has Null Flag = N but source profiling shows {{value}}% nulls with no COALESCE/default handling."
    fix_suggestion: "Either set Null Flag to 'Y', add a COALESCE/default in transformation logic, or document why nulls will not propagate."

  - id: A4
    category: artifact_consistency
    check: "User prompt instructions do not silently override authoritative metadata"
    severity: warning
    applies_to: all
    logic: |
      for each override in detect_prompt_overrides():
        if override.conflicts_with_metadata:
          if not override.has_explicit_justification:
            return FAIL(override)
      return PASS
    error_message: "Row {{row}} contains a user-prompt override of authoritative metadata for '{{column}}' without justification: '{{value}}'."
    fix_suggestion: "Document why the user instruction overrides the metadata, or revert to the metadata-derived value."

  - id: A5
    category: artifact_consistency
    check: "Columns renamed between artifacts are detected and mapped (alias reconciliation)"
    severity: warning
    applies_to: all
    logic: |
      for each artifact_pair in get_artifact_pairs():
        renames = detect_renames(artifact_pair.source, artifact_pair.target)
        for rename in renames:
          if not has_alias_mapping(rename):
            return FAIL(rename)
      return PASS
    error_message: "Column '{{column}}' appears renamed between artifacts ('{{value}}') but no alias mapping exists."
    fix_suggestion: "Add an explicit alias/rename mapping to reconcile the column name difference between artifacts."

  - id: A6
    category: artifact_consistency
    check: "Code-derived source columns exist in declared source schema"
    severity: warning
    applies_to: all
    logic: |
      code_source_columns = extract_source_columns_from_code(code_artifacts)
      for col_ref in code_source_columns:
        if metadata_available(col_ref.table):
          if col_ref.column not in get_columns(col_ref.table):
            return FAIL(col_ref)
      return PASS
    error_message: "Code references source column '{{value}}' which does not exist in the declared source schema for table '{{column}}'."
    fix_suggestion: "Verify the column reference in code against the source schema. Check for typos, renames, or schema drift."

  - id: A7
    category: artifact_consistency
    check: "All required audit columns present per classified table type"
    severity: blocker
    applies_to: all
    logic: |
      table_type = trim(target_table_type)
      if table_type == 'Transactional':
        required = ['dw_lod_tmp', 'dw_bus_dt']
      elif table_type == 'NonTransactional_SCD1':
        required = ['dw_lod_tmp', 'dw_upd_lod_tmp']
      elif table_type == 'NonTransactional_SCD2':
        required = ['eff_start_date', 'eff_end_date', 'active', 'dw_lod_tmp', 'dw_upd_lod_tmp']
      else:
        return PASS  # Unknown table type — skip
      table_columns = get_target_columns(target_table)
      for col in required:
        if col not in table_columns:
          return FAIL(target_table, table_type, col)
      return PASS
    error_message: "Target table '{{table}}' (type: {{table_type}}) is missing required audit column '{{column}}'."
    fix_suggestion: "Add the missing audit column. Required per type — Transactional: dw_lod_tmp, dw_bus_dt. NonTransactional_SCD1: dw_lod_tmp, dw_upd_lod_tmp. NonTransactional_SCD2: eff_start_date, eff_end_date, active, dw_lod_tmp, dw_upd_lod_tmp."

# -----------------------------------------------------------------------------
# Category 5: Output-Format Validations (F1–F13)
# -----------------------------------------------------------------------------
output_format:
  - id: F1
    category: output_format
    check: "All 16 template columns present in output"
    severity: blocker
    applies_to: all
    logic: |
      required_columns = [
        'Target Database', 'Target Table', 'Target Column Name',
        'Target Column Definition/Description', 'Target Column Datatype',
        'Target Column Null Flag', 'Source Database', 'Source Table Name',
        'Source Column Name', 'Business Logic/Transformation Logic',
        'Additional Context', 'Target Table description',
        'Transformation Type', 'Default Value', 'Target Table Type',
        'Key Column'
      ]
      output_columns = get_output_columns()
      missing = set(required_columns) - set(output_columns)
      if len(missing) > 0:
        return FAIL(missing)
      return PASS
    error_message: "Output is missing required template columns: {{value}}."
    fix_suggestion: "Add all 16 template columns to the output. Refer to templates/mapping_spec.md for the complete column list."

  - id: F2
    category: output_format
    check: "Column order matches template specification"
    severity: blocker
    applies_to: all
    logic: |
      expected_order = get_template_column_order()
      actual_order = get_output_column_order()
      if expected_order != actual_order:
        return FAIL(actual_order)
      return PASS
    error_message: "Output column order does not match template specification. Found: {{value}}."
    fix_suggestion: "Reorder output columns to match templates/mapping_spec.md column sequence exactly (A through P)."

  - id: F3
    category: output_format
    check: "No extra columns beyond template definition"
    severity: blocker
    applies_to: all
    logic: |
      template_columns = get_template_columns()
      output_columns = get_output_columns()
      extras = set(output_columns) - set(template_columns)
      if len(extras) > 0:
        return FAIL(extras)
      return PASS
    error_message: "Output contains extra columns not in template definition: {{value}}."
    fix_suggestion: "Remove extra columns from the output. Only the 16 template-defined columns should be present."

  - id: F4
    category: output_format
    check: "System columns use (system)/(derived) markers per template convention"
    severity: warning
    applies_to: all
    logic: |
      for each row in output_rows:
        if is_system_generated_column(row):
          if row.source_database not in ['(system)', '(derived)']:
            return FAIL(row)
      return PASS
    error_message: "Column '{{column}}' in row {{row}} is system-generated but does not use (system)/(derived) marker in Source Database: '{{value}}'."
    fix_suggestion: "Set Source Database to '(system)' or '(derived)' for columns without a physical source."

  - id: F5
    category: output_format
    check: "Audit columns present per table type (Transactional: dw_lod_tmp, dw_bus_dt; NonTransactional_SCD1: dw_lod_tmp, dw_upd_lod_tmp; NonTransactional_SCD2: eff_start_date, eff_end_date, active, dw_lod_tmp, dw_upd_lod_tmp)"
    severity: warning
    applies_to: all
    logic: |
      table_type = trim(target_table_type)
      if table_type == 'Transactional':
        required = ['dw_lod_tmp', 'dw_bus_dt']
      elif table_type == 'NonTransactional_SCD1':
        required = ['dw_lod_tmp', 'dw_upd_lod_tmp']
      elif table_type == 'NonTransactional_SCD2':
        required = ['eff_start_date', 'eff_end_date', 'active', 'dw_lod_tmp', 'dw_upd_lod_tmp']
      else:
        required = ['dw_lod_tmp']  # minimum for unknown table type
      table_columns = get_target_columns(target_table)
      for col in required:
        if col not in table_columns:
          return FAIL(col)
      return PASS
    error_message: "Target table '{{value}}' (type: {{table_type}}) is missing required audit column '{{column}}'."
    fix_suggestion: "Add the required audit columns per table type. Transactional: dw_lod_tmp + dw_bus_dt. NonTransactional_SCD1: dw_lod_tmp + dw_upd_lod_tmp. NonTransactional_SCD2: eff_start_date + eff_end_date + active + dw_lod_tmp + dw_upd_lod_tmp."

  - id: F6
    category: output_format
    check: "Output 'Mapping' sheet contains data matching the classified scenario"
    severity: blocker
    applies_to: all
    logic: |
      mapping_sheet = get_output_sheet('Mapping')
      if mapping_sheet is None:
        return FAIL("No 'Mapping' sheet found in output")
      scenario_data = get_scenario_data(scenario_classification)
      if not sheet_contains_scenario_data(mapping_sheet, scenario_data):
        return FAIL(scenario_classification)
      return PASS
    error_message: "Output 'Mapping' sheet does not contain data matching classified scenario '{{value}}'."
    fix_suggestion: "Ensure the Mapping sheet contains data for the classified scenario. Output should have exactly 2 sheets: Mapping + Source Volumetrics."

  - id: F7
    category: output_format
    check: "Source Volumetrics sheet populated for all referenced source tables"
    severity: warning
    applies_to: all
    logic: |
      referenced_sources = get_all_source_tables(mapping_rows)
      volumetrics_sources = get_volumetrics_sheet_tables()
      missing = referenced_sources - volumetrics_sources
      if len(missing) > 0:
        return FAIL(missing)
      return PASS
    error_message: "Source Volumetrics sheet is missing entries for source tables: {{value}}."
    fix_suggestion: "Add rows to the Source Volumetrics sheet for all referenced source tables."

  - id: F8
    category: output_format
    check: "Source Volumetrics Primary Key column populated for every source table"
    severity: warning
    applies_to: all
    logic: |
      for each source_entry in volumetrics_sheet:
        if is_empty(source_entry.primary_key):
          return FAIL(source_entry.table_name)
      return PASS
    error_message: "Source Volumetrics entry for table '{{value}}' is missing the Primary Key column."
    fix_suggestion: "Populate the Primary Key column in Source Volumetrics for each source table."

  - id: F9
    category: output_format
    check: "Tab colors: Blue (#4472C4) for Mapping sheet, Green (#00B050) for Source Volumetrics"
    severity: warning
    applies_to: all
    logic: |
      mapping_sheet = get_output_sheet('Mapping')
      vol_sheet = get_output_sheet('Source Volumetrics')
      if mapping_sheet and mapping_sheet.tab_color != '4472C4':
        return FAIL('Mapping', mapping_sheet.tab_color)
      if vol_sheet and vol_sheet.tab_color != '00B050':
        return FAIL('Source Volumetrics', vol_sheet.tab_color)
      return PASS
    error_message: "Sheet '{{column}}' has incorrect tab color '{{value}}'."
    fix_suggestion: "Set tab color to Blue (#4472C4) for Mapping sheet and Green (#00B050) for Source Volumetrics."

  - id: F10
    category: output_format
    check: "Row 1 headers exactly match specification headers (case-sensitive, all 16 columns per templates/mapping_spec.md)"
    severity: blocker
    applies_to: all
    logic: |
      expected_headers = get_spec_headers()  # case-sensitive, from templates/mapping_spec.md
      actual_headers = get_output_row1()
      if expected_headers != actual_headers:
        mismatches = find_mismatches(expected_headers, actual_headers)
        return FAIL(mismatches)
      return PASS
    error_message: "Row 1 headers do not match specification. Mismatches: {{value}}."
    fix_suggestion: "Copy headers exactly from templates/mapping_spec.md. Headers are case-sensitive and must match character-for-character."

  - id: F11
    category: output_format
    check: "Row 2 contains mapping data (no instructions row in output — data starts at Row 2)"
    severity: blocker
    applies_to: all
    logic: |
      row2 = get_output_row(2)
      if contains_instruction_text(row2):
        return FAIL
      if is_empty_row(row2):
        return FAIL
      return PASS
    error_message: "Row 2 in sheet '{{value}}' still contains instruction text or is empty — output should have data starting at Row 2."
    fix_suggestion: "Remove the instructions row from output. Row 1 = headers, Row 2+ = mapping data."

  - id: F12
    category: output_format
    check: "Source Volumetrics estimated_rows populated (enables broadcast_hint accuracy)"
    severity: warning
    applies_to: all
    logic: |
      missing_tables = []
      for each source_entry in source_volumetrics:
        if source_entry.estimated_rows is null:
          missing_tables.append(source_entry.source_table)
      if len(missing_tables) > 0:
        return WARN(missing_tables)
      return PASS
    error_message: "Source Volumetrics estimated_rows is null for tables: {{value}}. broadcast_hint may be inaccurate for these tables."
    fix_suggestion: "Run /sttm-resolve to provide row count estimates. Profiling data can be provided as an Excel workbook in input/source_metadata/ or input/profiling/. Alternatively, run the row count query from profiling_queries.sql against your source database. Tables < 10,000 rows should have broadcast_hint = 'Y'."

  - id: F13
    category: output_format
    check: "SELECT * not present in Business Logic — all columns must be explicitly expanded"
    severity: warning
    applies_to: all
    logic: |
      if 'SELECT *' in business_logic or 'select *' in business_logic:
        return FAIL
    error_message: "Row {{row}} contains 'SELECT *' in Business Logic — columns must be explicitly listed"
    fix_suggestion: "Expand SELECT * to individual column references."

# =============================================================================
# Category 6: File I/O Validations (FIO)
# =============================================================================
# Applied when io_mode is 'file' or 'hybrid'. Skipped entirely for io_mode='table'.

file_io_validations:
  applies_when: "classification.io_mode in ['file', 'hybrid']"

  FIO1:
    name: "File source path format"
    description: >
      File source storage paths must be valid absolute paths for the platform.
      Glue: s3:// URI (e.g., 's3://raw-bucket/data/customer_events/') or relative path starting with 'data/'.
      Databricks: /Volumes/ path (e.g., '/Volumes/catalog/schema/volume/customer_events/').
    severity: blocker
    check: "Each source_io.sources[].storage_path matches platform-specific path pattern (s3:// or data/ for Glue; /Volumes/ for Databricks)"
    auto_fix: false

  FIO2:
    name: "File target partition columns exist"
    description: "All columns listed in target_io.partition_by must exist in the target column list."
    severity: blocker
    check: "Every column in target_io.partition_by appears in target_columns[]"
    auto_fix: false

  FIO3:
    name: "SCD2 incompatible with file target"
    description: >
      File targets with write_mode 'overwrite' or 'append' cannot use table_type
      NonTransactional_SCD2. SCD2 requires a MERGE operation (CDC two-phase merge)
      which is not supported on plain parquet files.
    severity: blocker
    check: "NOT (target_io is present AND table_type == 'NonTransactional_SCD2')"
    auto_fix: false

  FIO4:
    name: "File source schema inference warning"
    description: >
      File sources with schema_mode='inferred' rely on runtime schema inference
      from parquet file metadata. Column names and types may differ from expectations.
      Providing an explicit schema in input/source_metadata/{logical_name}_schema.json
      is recommended for production pipelines.
    severity: warning
    check: "source_io.sources[].schema_mode != 'inferred' OR explicit schema file exists"
    auto_fix: false

# ── Category 7: Multi-Source-System Validations ─────────────────────────────
# Applied when data_flow_detection.source_systems is non-empty

MF1:
  id: MF1
  category: multi-source-system
  severity: blocker
  description: "Each source_system config must contain at least one source table"
  rule: "When source_systems is non-empty, verify that every generated per-source-system config has at least one non-empty table_type section under 'source'."
  applies_when: "data_flow_detection.source_systems has entries"

MF2:
  id: MF2
  category: multi-source-system
  severity: blocker
  description: "process_name must include source_system suffix in multi-source mode"
  rule: "When source_systems is non-empty, verify that pipeline.process_name ends with '_{source_system}' matching the source_system label for this config."
  applies_when: "data_flow_detection.source_systems has entries"

MF3:
  id: MF3
  category: multi-source-system
  severity: warning
  description: "SCD2 tables with independent source_system flows require non-overlapping PKs"
  rule: "When source_systems is non-empty AND table_type == 'NonTransactional_SCD2', warn that each source_system runs independent CDC merge. Rows across flows must have non-overlapping primary keys or include a source_system discriminator column in the PK to prevent cross-flow CDC conflicts."
  applies_when: "data_flow_detection.source_systems has entries AND table_type in ('NonTransactional_SCD2')"

MF4:
  id: MF4
  category: multi-source-system
  severity: warning
  description: "Rolling deletion executes independently per source_system job"
  rule: "When source_systems is non-empty AND rolling_deletion.enabled == true, warn that the deletion predicate executes per source_system job invocation. The predicate is idempotent but user should be aware that multiple jobs may execute the same DELETE statement against the shared target table."
  applies_when: "data_flow_detection.source_systems has entries AND rolling_deletion.enabled == true"

MF5:
  id: MF5
  category: multi-source-system
  severity: blocker
  description: "Staging and checkpoint paths must include source_system component"
  rule: "When source_systems is non-empty, verify that staging and checkpoint paths contain the source_system value to prevent path collision between concurrent source_system jobs."
  applies_when: "data_flow_detection.source_systems has entries"

MF6:
  id: MF6
  category: multi-source-system
  severity: blocker
  description: "DAG ID and job name must include source_system component"
  rule: "When source_systems is non-empty, verify that DAG IDs, Databricks job names, and Glue job names include the source_system value to prevent scheduling and naming collisions."
  applies_when: "data_flow_detection.source_systems has entries"
