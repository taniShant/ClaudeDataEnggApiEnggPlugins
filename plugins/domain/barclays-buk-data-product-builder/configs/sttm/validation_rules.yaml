  - id: M34
    category: mapping_content
    check: "CREATE_VIEW intermediate steps include source_tables and resolves_to_base_tables for nested views"
    severity: blocker
    applies_to: multi_step_only
    logic: |
      if intermediate_steps is non-empty:
        view_steps = [s for s in intermediate_steps if s.statement_type == 'CREATE_VIEW']
        for step in view_steps:
          if not step.source_tables or len(step.source_tables) == 0:
            return FAIL(step.step_number, "CREATE_VIEW step has empty source_tables")
          # Check if any source_table is itself a view defined earlier in the chain
          defined_views = [s.temp_table_name for s in intermediate_steps if s.statement_type == 'CREATE_VIEW' and s.step_number < step.step_number]
          for src in step.source_tables:
            if src in defined_views:
              if not step.get('resolves_to_base_tables') or len(step.resolves_to_base_tables) == 0:
                return FAIL(step.step_number, "nested view without resolves_to_base_tables")
      return PASS
    error_message: "Step {{step_number}} is CREATE_VIEW but does not properly resolve to base tables: {{value}}."
    fix_suggestion: "Populate source_tables with the base tables the view selects from. For nested views, add resolves_to_base_tables listing the ultimate base tables."

