# =============================================================================
# Pipeline Config — {{table_name}} (Databricks)
# Generated by DE Agent
#
# Per-target-table metadata config. Single source of truth for all pipeline
# parameters consumed by the driver notebook or used during artefact generation.
#
# Scenario: Single data flow — all source tables from one or more catalogs.
# Environment + catalog agnostic: driver resolves catalogs at runtime from the
# environments section (single source of truth for all catalog names).
# =============================================================================

# ── ENVIRONMENTS (runtime catalog resolution by deployment target)
# Driver extracts config['environments'][environment] and overrides target/source catalogs.
environments:
  dev:
    target_catalog: "{{dev_target_catalog}}"
    source_catalogs:
      source_catalog_1: "{{dev_source_catalog_1}}"
      # Additional source catalogs (source_catalog_2, ...) added during generation
      # only when domain knowledge specifies tables from a different catalog.
    staging:
      checkpoint_path: "/Volumes/{{dev_target_catalog}}/{{target_schema}}/temp/{{table_name}}/checkpoint"
      staging_path: "/Volumes/{{dev_target_catalog}}/{{target_schema}}/temp/{{table_name}}/staging"
    # target_io — ONLY when target is a parquet file (session_state.target_io present).
    # Do NOT emit for table-target pipelines — omit entirely.
    # target_io:
    #   path: "/Volumes/{{dev_target_catalog}}/{{target_schema}}/file_data/{{table_name}}"
    #   write_mode: "overwrite"  # or "append"
    #   partition_by: [{{partition_columns}}]
    #   compression: "snappy"
    # source_file_paths — ONLY when io_mode is 'file' or 'hybrid'.
    # Do NOT emit for table-only pipelines — omit entirely. Dev uses actual path from mapping.
    # source_file_paths:
    #   {{alias}}: "/Volumes/catalog/schema/volume/data"

  preprd:
    target_catalog: "{{preprd_target_catalog}}"
    source_catalogs:
      source_catalog_1: "{{preprd_source_catalog_1}}"
      # Additional source catalogs (source_catalog_2, ...) added during generation
      # only when domain knowledge specifies tables from a different catalog.
    staging:
      checkpoint_path: "/Volumes/{{preprd_target_catalog}}/{{target_schema}}/temp/{{table_name}}/checkpoint"
      staging_path: "/Volumes/{{preprd_target_catalog}}/{{target_schema}}/temp/{{table_name}}/staging"
    # target_io — ONLY when target is a parquet file. Do NOT emit for table-target pipelines.
    # target_io:
    #   path: "/Volumes/{{preprd_target_catalog}}/{{target_schema}}/file_data/{{table_name}}"
    #   write_mode: "overwrite"
    #   partition_by: [{{partition_columns}}]
    #   compression: "snappy"
    # source_file_paths — ONLY when io_mode is 'file' or 'hybrid'. Do NOT emit for table-only pipelines.
    # REPLACE: Update source file path for preprd environment before promotion
    # source_file_paths:
    #   {{alias}}: "{{REPLACE_BEFORE_PROMOTION}}"

  prd:
    target_catalog: "{{prd_target_catalog}}"
    source_catalogs:
      source_catalog_1: "{{prd_source_catalog_1}}"
      # Additional source catalogs (source_catalog_2, ...) added during generation
      # only when domain knowledge specifies tables from a different catalog.
    staging:
      checkpoint_path: "/Volumes/{{prd_target_catalog}}/{{target_schema}}/temp/{{table_name}}/checkpoint"
      staging_path: "/Volumes/{{prd_target_catalog}}/{{target_schema}}/temp/{{table_name}}/staging"
    # target_io — ONLY when target is a parquet file. Do NOT emit for table-target pipelines.
    # target_io:
    #   path: "/Volumes/{{prd_target_catalog}}/{{target_schema}}/file_data/{{table_name}}"
    #   write_mode: "overwrite"
    #   partition_by: [{{partition_columns}}]
    #   compression: "snappy"
    # source_file_paths — ONLY when io_mode is 'file' or 'hybrid'. Do NOT emit for table-only pipelines.
    # REPLACE: Update source file path for prd environment before promotion
    # source_file_paths:
    #   {{alias}}: "{{REPLACE_BEFORE_PROMOTION}}"

  {{#if has_uat}}
  uat:
    target_catalog: "{{uat_target_catalog}}"
    source_catalogs:
      source_catalog_1: "{{uat_source_catalog_1}}"
      # Additional source catalogs (source_catalog_2, ...) added during generation
      # only when domain knowledge specifies tables from a different catalog.
    staging:
      checkpoint_path: "/Volumes/{{uat_target_catalog}}/{{target_schema}}/temp/{{table_name}}/checkpoint"
      staging_path: "/Volumes/{{uat_target_catalog}}/{{target_schema}}/temp/{{table_name}}/staging"
    # target_io — ONLY when target is a parquet file. Do NOT emit for table-target pipelines.
    # target_io:
    #   path: "/Volumes/{{uat_target_catalog}}/{{target_schema}}/file_data/{{table_name}}"
    #   write_mode: "overwrite"
    #   partition_by: [{{partition_columns}}]
    #   compression: "snappy"
    # source_file_paths — ONLY when io_mode is 'file' or 'hybrid'. Do NOT emit for table-only pipelines.
    # REPLACE: Update source file path for uat environment before promotion
    # source_file_paths:
    #   {{alias}}: "{{REPLACE_BEFORE_PROMOTION}}"
  {{/if}}

# ── TARGET IDENTITY (catalog injected at runtime from environments section)
target:
  schema: "{{target_schema}}"
  table: "{{table_name}}"

# ── File target output (parquet) ──────────────────────────────────
# When target is a parquet file, target_io is populated inside each
# environments.{env} block (alongside staging) by /gen-config STEP 3.8.
# The driver resolves the active environment's target_io at runtime.
# When present: CDC section and rolling_deletion section are omitted.
# See environments section above for target_io structure per environment.

# ── PIPELINE METADATA (driver derives all runtime params from this section)
pipeline:
  process_name: "{{target_schema}}_{{table_name}}"
  tenancy_name: "{{tenancy_name}}"
  data_product_type: "{{data_product_type}}"
  domain_name: "{{domain_name}}"
  table_type: "{{table_type}}"
  load_type: "{{load_type}}"
  process_frequency: "{{process_frequency}}"  # DAILY | WORKING_DAYS | ONCE_A_MONTH | WEEKLY_ONCE | ALTERNATE_DAYS | TUE_TO_SAT
  catch_up_threshold_days: 1  # Days behind system date before catch_up_mode filters activate (day1/BAU only)

# ── CDC CONFIGURATION
# NonTransactional_SCD2: include full section (primary_key_cols, exclude_cols, high_ended_date, snapshot_mode, etc.)
# NonTransactional_SCD1: include ONLY primary_key_cols + exclude_cols (no high_ended_date, no snapshot_mode, no validate_unique_keys/duplicates_ts_col/dedup_order)
# Transactional: omit entire section
# NOTE: validate_unique_keys, duplicates_ts_col, dedup_order are ONLY applicable to NonTransactional_SCD2 BAU/Day1 (run_cdc)
cdc:
  primary_key_cols:
    - "{{primary_key_col_1}}"
  exclude_cols:
    - "{{cdc_exclude_col_1}}"
  high_ended_date: "3499-12-31"  # SCD2 only — omit for SCD1
  broadcast_source: false
  validate_unique_keys: false  # default false; set true via Additional Context 'validate_unique_keys:true'
  # NOTE: Handlebars {{#if}} treats undefined/null/""/0/false as falsy and silently
  # omits the block — it does NOT throw on missing variables. No extra guard needed.
  {{#if duplicates_ts_col}}
  duplicates_ts_col: "{{duplicates_ts_col}}"  # timestamp column for intraday dedup — omit if not needed
  {{/if}}
  {{#if dedup_order}}
  dedup_order: "{{dedup_order}}"  # asc|desc — omit if duplicates_ts_col not specified
  {{/if}}
  snapshot_mode: {{snapshot_mode}}  # SCD2 only — omit for SCD1

# rolling_deletion — Optional. Applicable to Transactional and NonTransactional_SCD1 only.
# Omit entirely for NonTransactional_SCD2. {current_business_date} interpolated at runtime.
# rolling_deletion:
#   enabled: true
#   predicate: "dw_bus_dt < DATE_SUB(CAST('{current_business_date}' AS DATE), 90)"

# ── SOURCE TABLES (catalog-agnostic — use catalog_key to map to source_catalogs
# defined in the environments section above)
# source_catalog_1 is the default (tenancy source catalog, auto-resolved).
# source_catalog_2+ only when domain knowledge specifies tables from a different catalog.
# Placement rule: NonTransactional_SCD2 → non_transactional; NonTransactional_SCD1 → non_transactional_scd1; Transactional → transactional
source:
  non_transactional:
    {{scd2_source_table_name_1}}:
      catalog_key: "source_catalog_1"
      table: "{{source_schema_1}}.{{scd2_source_table_name_1}}"
      columns:
        - "{{source_column_1}}"
        - "{{source_column_2}}"
  non_transactional_scd1:
    {{scd1_source_table_name_1}}:
      catalog_key: "source_catalog_1"
      table: "{{source_schema_1}}.{{scd1_source_table_name_1}}"
      columns:
        - "{{source_column_1}}"
        - "{{source_column_2}}"
  transactional:
    {{transactional_source_table_name_1}}:
      catalog_key: "source_catalog_1"
      table: "{{source_schema_2}}.{{transactional_source_table_name_1}}"
      columns:
        - "{{source_column_1}}"
        - "{{source_column_2}}"

  # ── File-based sources (parquet) ──────────────────────────────────
  # Populated by /gen-config STEP 1.8 when io_mode is 'file' or 'hybrid'.
  # Omitted entirely for table-only pipelines.
  # The path here is the original value from mapping Column H (dev environment).
  # At runtime, the driver overrides each alias's path from
  # environments.{env}.source_file_paths.{alias} for the active environment.
  # file:
  #   {{alias}}:
  #     path: "{{storage_path}}"
  #     columns: [{{columns}}]
  #     filter: {{filter_expression}}  # optional

# ── FILTERS (same 3-case resolution as Glue: default → alias-specific → '1=1')
filters:
  day0:
    non_transactional:
      default: "eff_start_date <= '{current_business_date}'"
    non_transactional_scd1:
      default: "1=1"
    transactional:
      default: "dw_bus_dt <= '{current_business_date}'"
  day1:
    non_transactional:
      default: "active = '1'"
    non_transactional_scd1:
      default: "1=1"
    transactional:
      default: "dw_bus_dt = '{current_business_date}'"
  catch_up_mode:
    non_transactional:
      default: "eff_start_date <= '{current_business_date}' AND eff_end_date > '{current_business_date}'"
    non_transactional_scd1:
      default: "1=1"
    transactional:
      default: "dw_bus_dt <= '{current_business_date}'"

# ── AUDIT (AuditLogger target table — catalog prepended by driver at runtime)
audit:
  table: "{{target_schema}}.audit_log"

# ── DATE COLUMNS (optional additional date columns for filter resolution)
date_columns: []

# ── PARTITION
partition_col: "{{partition_col}}"
