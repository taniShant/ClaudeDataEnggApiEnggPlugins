# Common USCB Request headers
Correlation-ID:
  in: header
  name: Correlation-ID
  required: false
  deprecated: false
  allowEmptyValue: false
  description: |
    Unique end-to-end trace ID. The initiating system (such as a Channel or
    Batch Job), must generate this unique ID, then this must be passed
    through the API call stack. This is required to maintain compliance with the current Barclays REST Standard.
  schema:
    type: string
    deprecated: false
    nullable: false
    pattern: ^[a-zA-Z0-9-+/=_]{1,128}$
    minLength: 1
    maxLength: 128
  example: "644e1dd7-2a7f-18fb-b8ed-ed78c3F92c2b"

Authorization:
  name: Authorization
  in: header
  required: false
  deprecated: false
  allowEmptyValue: false
  description: Bearer Token
  schema:
    type: string
    pattern: ^[A-Za-z0-9\-_\.\ ]{32,4610}$
    minLength: 32
    maxLength: 4610
  example: "Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6Imctb09kUnc1TWFlTmcwbWpsN1VpczlXT010NCIsInBpLmF0bSI6IjQ2N3YifQ..Jkgb2A2HAOdLKaion8ff097GedtQkxtAV4Qxea538owLS8zaEvTm9kHBWOxmuNHIgP1V8mx3NUflwbY8A823Ut00wWqbUbB-cSV0idDaQJ2pKWHDFYbipvi5I7yPGj2BR-oHhQao1ZGlW6DyxYuZ12q8IK7LpKVWbCSPZ-fFAlD5HgH_FORq6Avc5oLH--Zcww63fI6gtZ48pwnXX2gM1aiSQ3lfvLXWVQ9fooAlP65LOW1MMjh5HOtrNvA7ObBSYepYzef5ykP2YvIz3OOS4hLhTo-3-iEbUDvkPx_mmz_pi7piXrMqQPfPnz5y2VkLOHTYfQJeQmVg60YTG7uPdw"

Content-Type:
  name: Content-Type
  in: header
  required: false
  deprecated: false
  allowEmptyValue: false
  description: |
    Standard HTTP Header represents the format of the payload being returned in the response.
  schema:
    type: string
    pattern: ^[a-zA-Z0-9 .,=&'#/-]{16,40}$
    minLength: 16
    maxLength: 40
    nullable: false
    deprecated: false
  example: "application/json"


# Common USCB Response Headers

Cache-Control:
  description: "GIS mandatory response header. This is added by the Cognac sidecar."
  schema:
    type: string
    pattern: ^no-cache, no-store, must-revalidate$
    minLength: 35
    maxLength: 35
    nullable: false
    deprecated: false
    default: no-cache, no-store, must-revalidate
    example: no-cache, no-store, must-revalidate


