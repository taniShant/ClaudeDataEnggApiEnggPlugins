# -----------------------------------------------------------------------------
# This file contains definitions of the MCA1 headers
# The MCA1 headers have multiple formats (json and comma-delimited) 
# These headers generated by the MCA Proxy from SOR data and can contain ASCII Printable/Extended Latin characters
# -----------------------------------------------------------------------------   
UserContextHeader:
  name: UserContextHeader
  description: UserContext header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096 
  example: 'UID:H06100171,deviceId:D02027,CHN:5,HSC:201656,EID:3128045303,OLT:0,Proposition: LRP_MCSS,LOC:1234,touchpointType:VA,clientAuditData:callId=1234#MALID=MAMMYP,SID:37bf356a-568d-4c80-8c5b-f54315cf6c9f,correlationId:5c858f67-da0d-415a-8c81-29bb5cee615f'

AccountContextHeader:
  name: AccountContextHeader
  description: AccountContext header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 1024
  example: '{"accountNumber":"00575135", "sortCode":"201656"}'
  
  
  
AccountListHeader:
  name: AccountListHeader
  description: AccountList Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096
  example: '[{"accountNumber":"12345667","accountStatus":"0","sortCode":"201656","productCode":"12"},{"accountNumber":"45345667","accountStatus":"1","sortCode":"201656","productCode":"14"}]'
  
MultipleAccountsHeader:
  name: MultipleAccountsHeader
  description: MultipleAccounts Header 
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096
  example: '{ "relatedAccounts": [ {"memberId": "1234567890","accountNo": "14465786", "sortCode": "201656", "productCode":"05", "accStatus":"1" }, { "memberId": "1234567890", "accountNo": "10113026", "sortCode": "201656", "productCode":"14", "accStatus":"0" }]}'
  
ApplicationContextDataHeader:
  name: ApplicationContextDataHeader
  description: ApplicationContextData Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 2048
  example: 'Other:Other,test:test'

CustomerContextHeader:
  name: CustomerContextHeader
  description: CustomerContext Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096
  example: '{"foreName":"ALETA","surName":"REID","title":"Mr","customerId":"3236003623","dateOfBirth":"22/12/1993"}'

PreferenceContextHeader:
  name: PreferenceContextHeader
  description: PreferenceContext Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 2048
  example: '{"nickName":{"10935336201640":"SAVINGS"},"hidden":{"10935336201640":false}}'
  
LanguageHeader:
  name: LanguageHeader
  description: Language Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[A-Za-z0-9]*$
    minLength: 0
    maxLength: 20
  example: 'EN'
  
ConfigDataHeader:
  name: ConfigDataHeader
  description: ConfigData Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096
  example: 'userMode:2,sortCode:209956,accountNumber:20921459,accName:WALLIS C,cardNumber:4658594719943,viewLevel:card:'
  
ThirdPartyContextHeader:
  name: ThirdPartyContextHeader
  description: ThirdPartyContext Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 2048
  example: '{"partyType": "CUSTOMER","partyData": {"customerId": "12345678","accountNumber": "40433667","sortCode": "201656","customerName": "John Doe"} }'
  
SecureContextHeader:
  name: SecureContextHeader
  description: SecureContext Header
  required: false
  deprecated: false
  allowEmptyValue: false
  in: header
  schema:
    type: string
    pattern: ^[\x20-\x7E\u00A0-\u00FF]*$
    minLength: 0
    maxLength: 4096
  example: '{"accountNumber":"00575135", "sortCode":"201656"}'

InternalTiaaRopcAuth:
  type: apiKey
  name: OAuthHeader
  in: header
  description: |
    OAuth2.0 Resource Owner Password Credentials (ROPC) Grant authentication using TIAA-AS for MCA internal APIs. Token should be provided in OAuthHeader header as 'Bearer {token}'
    example  
    ```
    OAuthHeader: Bearer eyJhbGciOiJSUzI1NiIs...
    ```
